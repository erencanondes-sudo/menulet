<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menület</title>
<style>
/* Geçici sade görünüm: asıl tasarım sonra gelecek */
:root{--zemin:#ffffff;--yazi:#222222;--soluk:#6b6b6b;--cizgi:#dddddd;--kutu:#f4f4f4;--vurgu:#50344c;--vurgu-yazi:#ffffff;--hata:#b3261e;--tamam:#1d6b3a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--zemin);color:var(--yazi);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#root{max-width:30rem;margin:0 auto;padding:0 1rem 2rem;min-height:100vh}
@media(min-width:64em){#root{max-width:60rem}}
.ust{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem 0;border-bottom:.0625rem solid var(--cizgi);margin-bottom:1.5rem}
.marka{font-weight:700;font-size:1.25rem;text-decoration:none;flex-shrink:0}
.ust-sag{display:flex;align-items:center;gap:.5rem;min-width:0}
.hesap{position:relative;min-width:0}
.isletme-adi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:.0625rem solid var(--cizgi);border-radius:.5rem;padding:.5rem .75rem;min-height:2.75rem}
.hesap-menu{position:absolute;right:0;top:calc(100% + .25rem);background:var(--zemin);border:.0625rem solid var(--cizgi);border-radius:.5rem;padding:.25rem;z-index:10;min-width:100%}
.hesap-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:.6rem .75rem;white-space:nowrap;min-height:2.75rem}
h1{font-size:1.6rem;margin:0 0 1rem}
form{display:grid;gap:1rem}
label{display:grid;gap:.35rem;font-weight:600}
input{width:100%;padding:.75rem;border:.0625rem solid var(--cizgi);border-radius:.5rem;background:var(--zemin)}
.ana-dugme{background:var(--vurgu);color:var(--vurgu-yazi);border:0;border-radius:.5rem;padding:.8rem 1rem;font-weight:700;min-height:2.75rem}
.baglantilar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;margin-top:1.25rem}
.baglantilar a{padding:.5rem 0}
.form-mesaj{margin:0;padding:.75rem;border-radius:.5rem;background:var(--kutu)}
.form-mesaj:empty{display:none}
.form-mesaj.hata{color:var(--hata)}
.form-mesaj.tamam{color:var(--tamam)}
.gizli{position:absolute;width:.0625rem;height:.0625rem;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.geri{display:inline-block;margin-bottom:1rem;padding:.5rem 0}
.bilgi{color:var(--soluk)}
/* ===== Ana sayfa: tek görsel; kartlar aynı görselin parçalarını gösterir (görsel dosyada bir kez var) ===== */
#root.tam{max-width:30rem;padding:0}
body:has(#root.tam){background:#fae9db}
.pano-dis{min-height:100vh;min-height:100dvh;background:#fae9db} /* uzun ekranlarda görselin altı, görselin alt rengiyle uzar */

<body>
<div id="root"><p class="bilgi">Yükleniyor…</p></div>
<script type="module">
/* =====================================================================
   MENÜLET
   Adresler: / (giriş) · /kayit · /sifre · /panel · /tasarim-sec · /tasarim-duzenle · /kategoriler · /urunler · /gorseller · /yayinla · /hizli-urun · /hizli-fiyat

   Veri yapısı (Firestore):
     users/{uid}                     { email, created }
     businesses/{isletmeId}          { owner (uid), name, created, updated }
     businesses/{isletmeId}/...      alt koleksiyonlar (categories, products, images…) sonraki aşamalarda
   Fotoğraflar (Storage): users/{uid}/<dosya>
   ===================================================================== */

// --- Firebase bağlantısı ---
const FB_TEMEL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const firebaseConfig = {
  apiKey: 'AIzaSyD9axc9mKz0VXOXL9z3ovcNRiYP28nh1bY',
  authDomain: 'menulet-3edcd.firebaseapp.com',
  projectId: 'menulet-3edcd',
  storageBucket: 'menulet-3edcd.firebasestorage.app',
  messagingSenderId: '742666635212',
  appId: '1:742666635212:web:4bf17528936bcfacd2bf69',
};
// Site GitHub Pages'te alt klasörde yayınlanır (kullanici.github.io/menulet/). TABAN o klasördür.
// Kendi alan adı bağlanırsa ya da yerelde açılırsa kök ('/') kullanılır.
const TABAN = (() => {
  if (!location.hostname.endsWith('.github.io')) return '/';
  const ilk = location.pathname.split('/')[1];
  return ilk ? '/' + ilk + '/' : '/';
})();
let FB = null; // yüklenemezse (internet yok) site açılır ama giriş çalışmaz
// Önce Google'ın sunucusu, olmazsa sitenin kendi kopyası (depoya fb klasörü eklenirse) denenir.
const YEREL_FB = location.protocol === 'file:' ? './fb/' : TABAN + 'fb/';
const FB_DOSYALAR = ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js', 'firebase-storage.js'];
for (const temel of [FB_TEMEL, YEREL_FB]) {
  try {
    const [uygulama, kimlik, veritabani, depo] = await Promise.all(FB_DOSYALAR.map((d) => import(temel + d)));
    const fbApp = uygulama.initializeApp(firebaseConfig);
    FB = { au: kimlik, fs: veritabani, st: depo, auth: kimlik.getAuth(fbApp), db: veritabani.getFirestore(fbApp), storage: depo.getStorage(fbApp) };
    FB.auth.languageCode = 'tr'; // şifre sıfırlama e-postası Türkçe gelsin
    break;
  } catch (e) { console.error('Firebase yüklenemedi:', temel, e); }
}

/* =====================================================================
   VERİ KATMANI
   ===================================================================== */
const DB = (() => {
  const simdi = () => new Date().toISOString();
  const hata = (code) => Object.assign(new Error(code), { code });
  const fb = () => { if (!FB) throw hata('auth/network-request-failed'); return FB; };
  let aktif = null; // { uid, email }

  async function isletmeler() {
    const { fs, db } = fb();
    if (!aktif) throw hata('permission-denied');
    const sn = await fs.getDocs(fs.query(fs.collection(db, 'businesses'), fs.where('owner', '==', aktif.uid)));
    return sn.docs.map((d) => ({ ...d.data(), id: d.id })).sort((a, b) => String(a.created).localeCompare(String(b.created)));
  }

  // --- Storage yardımcıları ---
  // Dosya adresi tutabilecek alanlar: işletme belgesinde ve işletmenin alt koleksiyonlarında
  const ISLETME_DOSYA_ALANLARI = ['logo', 'cover'];
  const ALT_KOLEKSIYONLAR = ['categories', 'products', 'images'];
  const DOSYA_ALANLARI = ['photo', 'image'];
  const bizimDosya = (url) => typeof url === 'string' && url.startsWith('https://firebasestorage.googleapis.com/') && url.includes('/b/' + firebaseConfig.storageBucket + '/');

  async function dosyaYukle(blob, uzanti) {
    const { st, storage } = fb();
    if (!aktif) throw hata('permission-denied');
    const ad = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.' + uzanti;
    const ref = st.ref(storage, `users/${aktif.uid}/${ad}`);
    await st.uploadBytes(ref, blob, { contentType: blob.type, cacheControl: 'public, max-age=31536000' });
    return st.getDownloadURL(ref);
  }

  // Dosyayı başka bir kayıt hâlâ kullanıyor mu? Emin olunamazsa "kullanılıyor" sayılır (silinmez).
  async function kullaniliyor(url) {
    const { fs, db } = fb();
    try {
      for (const b of await isletmeler()) {
        if (ISLETME_DOSYA_ALANLARI.some((a) => b[a] === url)) return true;
        for (const k of ALT_KOLEKSIYONLAR) for (const a of DOSYA_ALANLARI) {
          const q = fs.query(fs.collection(db, 'businesses', b.id, k), fs.where(a, '==', url), fs.limit(1));
          if ((await fs.getDocs(q)).size) return true;
        }
      }
      return false;
    } catch (e) { console.error('Dosya kullanımı denetlenemedi', e); return true; }
  }

  // Artık hiçbir kayıtta geçmeyen dosyaları Storage'dan siler. Hata olursa sessizce geçer.
  async function dosyaTemizle(urller) {
    if (!FB || !aktif) return;
    for (const url of [...new Set(urller || [])].filter(bizimDosya)) {
      try { if (!(await kullaniliyor(url))) await FB.st.deleteObject(FB.st.ref(FB.storage, url)); }
      catch (e) { if (e?.code !== 'storage/object-not-found') console.error('Dosya silinemedi', e); }
    }
  }

  // Fotoğrafı tarayıcıda küçültüp WebP'ye çevirir (varsayılan ~250 KB altı), Storage'a yükler, indirme adresini döndürür.
  // Cihazın okuyamadığı dosyalarda 'foto-okunamadi' hatası verir.
  async function fotoYukle(file, kb = 250, kenarSnr = 1600) {
    const HEDEF = kb * 1024;
    let kaynak = null;
    try { kaynak = await createImageBitmap(file); }
    catch {
      kaynak = await new Promise((ok, no) => {
        const url = URL.createObjectURL(file); const i = new Image();
        i.onload = () => { URL.revokeObjectURL(url); ok(i); };
        i.onerror = () => { URL.revokeObjectURL(url); no(); };
        i.src = url;
      }).catch(() => null);
    }
    if (!kaynak || !(kaynak.width > 0)) throw hata('foto-okunamadi');
    const deneme = document.createElement('canvas');
    const webp = deneme.toDataURL('image/webp').startsWith('data:image/webp');
    const tip = webp ? 'image/webp' : 'image/jpeg'; // eski tarayıcılarda JPEG'e düşer
    let olcek = Math.min(1, kenarSnr / Math.max(kaynak.width, kaynak.height));
    let blob = null;
    for (let tur = 0; tur < 8; tur++) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(kaynak.width * olcek));
      c.height = Math.max(1, Math.round(kaynak.height * olcek));
      const g = c.getContext('2d');
      if (!webp) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(kaynak, 0, 0, c.width, c.height);
      for (const kalite of [0.85, 0.75, 0.65, 0.55, 0.45, 0.35]) {
        blob = await new Promise((ok) => c.toBlob(ok, tip, kalite));
        if (!blob) throw hata('foto-okunamadi');
        if (blob.size <= HEDEF) break;
      }
      if (blob.size <= HEDEF) break;
      olcek *= 0.8;
    }
    if (kaynak.close) kaynak.close();
    return dosyaYukle(blob, webp ? 'webp' : 'jpg');
  }

  return {
    auth: {
      async hazir() {
        if (!FB) return null;
        const u = await new Promise((ok) => { const kapat = FB.au.onAuthStateChanged(FB.auth, (x) => { kapat(); ok(x); }); });
        aktif = u ? { uid: u.uid, email: u.email || '' } : null;
        return aktif;
      },
      async girisYap(email, sifre) {
        const { au, auth } = fb();
        const c = await au.signInWithEmailAndPassword(auth, String(email).trim(), String(sifre));
        aktif = { uid: c.user.uid, email: c.user.email || '' };
        return aktif;
      },
      // Hesabı açar; kullanıcı belgesi ve işletme kaydı tek işlemde birlikte yazılır.
      async kayitOl(isletmeAdi, email, sifre) {
        const { au, fs, auth, db } = fb();
        const c = await au.createUserWithEmailAndPassword(auth, String(email).trim(), String(sifre));
        aktif = { uid: c.user.uid, email: c.user.email || '' };
        const batch = fs.writeBatch(db);
        batch.set(fs.doc(db, 'users', aktif.uid), { email: aktif.email, created: simdi() });
        batch.set(fs.doc(fs.collection(db, 'businesses')), { owner: aktif.uid, name: isletmeAdi, created: simdi(), updated: simdi() });
        try { await batch.commit(); } catch (e) { console.error('İşletme kaydı oluşturulamadı', e); } // panelde tekrar oluşturulabilir
        return aktif;
      },
      async sifreSifirla(email) {
        const { au, auth } = fb();
        try { await au.sendPasswordResetEmail(auth, String(email).trim()); }
        catch (e) { if (e.code !== 'auth/user-not-found') throw e; } // hesap var/yok bilgisini sızdırma
      },
      async cikis() { if (FB) await FB.au.signOut(FB.auth); aktif = null; },
    },
    isletmeler,
    async isletmeOlustur(ad) {
      const { fs, db } = fb();
      if (!aktif) throw hata('permission-denied');
      await fs.addDoc(fs.collection(db, 'businesses'), { owner: aktif.uid, name: ad, created: simdi(), updated: simdi() });
    },
    fotoYukle,
    dosyaTemizle,
  };
})();

/* =====================================================================
   YARDIMCILAR VE YÖNLENDİRME
   ===================================================================== */
const app = document.getElementById('root');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Temiz adresler: https üzerinde /panel gibi; dosya (file:) olarak açılırsa #/ sistemi kullanılır.
const TEMIZ = /^https?:$/.test(location.protocol);
if (TEMIZ && location.hash.startsWith('#/')) history.replaceState(null, '', TABAN + location.hash.slice(2)); // eski #/ adreslerini çevir
const tabanSiz = (p) => {
  if (p === TABAN.slice(0, -1)) return '/';
  const y = p.startsWith(TABAN) ? '/' + p.slice(TABAN.length) : p;
  return y === '/index.html' || y === '/404.html' ? '/' : y.length > 1 && y.endsWith('/') ? y.slice(0, -1) : y;
};
const mevcutYol = () => (location.hash.startsWith('#/') ? location.hash.slice(1) : TEMIZ ? tabanSiz(location.pathname || '/') : '/');
const adres = (yol) => (TEMIZ ? TABAN + yol.slice(1) : '#' + yol);
const bag = (yol, metin, sinif = '') => `<a href="${esc(adres(yol))}" data-yol="${yol}"${sinif ? ` class="${sinif}"` : ''}>${metin}</a>`;
function git(yol, degistir = false) {
  if (mevcutYol() !== yol) history[degistir ? 'replaceState' : 'pushState'](null, '', adres(yol));
  render(); window.scrollTo(0, 0);
}

const GIRIS_SAYFALARI = ['/', '/kayit', '/sifre'];
const SAYFALAR = {
  '/tasarim-sec': 'Tasarım Seç', '/tasarim-duzenle': 'Tasarım Düzenle', '/kategoriler': 'Kategori', '/urunler': 'Ürünler',
  '/gorseller': 'Görsel Kütüphane', '/yayinla': 'QR Oluştur / Yayınla', '/hizli-urun': 'Hızlı Ürün Ekle', '/hizli-fiyat': 'Hızlı Fiyat Değiştir',
};
// Ana sayfa görselindeki kartların yeri (görsel 853×1844 piksel üzerinden): adres, sol, üst, sağ, alt, kartın çevresindeki renk
const PANO = { G: 853, Y: 1844 };
const KARTLAR = [
  ['/tasarim-sec', 28, 520, 419, 766, '#f0daca'], ['/tasarim-duzenle', 435, 520, 826, 766, '#cfb6a3'],
  ['/kategoriler', 28, 779, 419, 1010, '#ecd5c3'], ['/urunler', 435, 779, 826, 1010, '#edd5c4'],
  ['/gorseller', 28, 1026, 419, 1251, '#ebd3c1'], ['/yayinla', 435, 1026, 826, 1251, '#ecd4c2'],
  ['/hizli-urun', 28, 1266, 419, 1498, '#ead1bf'], ['/hizli-fiyat', 435, 1266, 826, 1498, '#ebd2c0'],
];

// durum: 'bos' (yüklenmedi) | 'yukleniyor' | 'hazir' | 'hata'
const S = { kullanici: null, isletme: null, durum: 'bos', menuAcik: false };
let sonYol = null;

function hataMetni(err) {
  return ({
    'auth/network-request-failed': 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.',
    'auth/too-many-requests': 'Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar deneyin.',
    'auth/email-already-in-use': 'Bu e-posta adresiyle zaten bir hesap var.',
    'auth/invalid-email': 'Geçerli bir e-posta adresi girin.',
    'auth/missing-email': 'E-posta adresinizi girin.',
    'auth/missing-password': 'Şifrenizi girin.',
    'auth/weak-password': 'Şifre en az 6 karakter olmalıdır.',
    'auth/invalid-credential': 'E-posta veya şifre hatalı.',
    'auth/wrong-password': 'E-posta veya şifre hatalı.',
    'auth/user-not-found': 'E-posta veya şifre hatalı.',
    'auth/user-disabled': 'Bu hesap devre dışı bırakılmış.',
    'auth/operation-not-allowed': 'E-posta/şifre ile giriş Firebase\'de etkin değil.',
    'permission-denied': 'Bu işlem için izin yok. Güvenlik kurallarını kontrol edin.',
  })[err?.code] || 'Beklenmeyen bir sorun oluştu. Tekrar deneyin.';
}

// Form gönderilirken sayfa yeniden çizilmez; yalnızca düğme ve mesaj güncellenir (yazılanlar kaybolmasın).
function formDurum(form, mesgul, mesaj = '', tur = '') {
  const btn = form.querySelector('button');
  if (!btn.dataset.metin) btn.dataset.metin = btn.textContent;
  btn.disabled = mesgul;
  btn.textContent = mesgul ? 'Lütfen bekleyin…' : btn.dataset.metin;
  const m = form.querySelector('.form-mesaj');
  m.textContent = mesaj; m.className = 'form-mesaj ' + tur;
}

/* =====================================================================
   EKRANLAR
   ===================================================================== */
function ustBar() {
  if (!S.kullanici) return `<header class="ust"><span class="marka">Menület</span></header>`;
  const ad = S.isletme?.name || S.kullanici.email;
  return `<header class="ust">${bag('/panel', 'Menület', 'marka')}<div class="ust-sag"><div class="hesap"><button class="isletme-adi" data-act="hesap-menu" aria-haspopup="true" aria-expanded="${S.menuAcik}">${esc(ad)}</button>${S.menuAcik ? '<div class="hesap-menu"><button data-act="cikis">Çıkış yap</button></div>' : ''}</div></div></header>`;
}

function sayfaGiris() {
  document.title = 'Giriş yap — Menület';
  return `<main><h1>Giriş yap</h1>
<form id="giris-form" novalidate><label>E-posta<input name="email" type="email" required autocomplete="email"></label>
<label>Şifre<input name="sifre" type="password" required autocomplete="current-password"></label>
<p class="form-mesaj" role="status"></p><button class="ana-dugme">Giriş yap</button></form>
<div class="baglantilar">${bag('/kayit', 'Hesap oluştur')}${bag('/sifre', 'Şifremi unuttum')}</div></main>`;
}

function sayfaKayit() {
  document.title = 'Hesap oluştur — Menület';
  return `<main><h1>Hesap oluştur</h1>
<form id="kayit-form" novalidate><label>İşletme adı<input name="isletme" required maxlength="80" autocomplete="organization"></label>
<label>E-posta<input name="email" type="email" required autocomplete="email"></label>
<label>Şifre<input name="sifre" type="password" required autocomplete="new-password"></label>
<p class="form-mesaj" role="status"></p><button class="ana-dugme">Hesap oluştur</button></form>
<div class="baglantilar">${bag('/', 'Hesabınız var mı? Giriş yapın')}</div></main>`;
}

function sayfaSifre() {
  document.title = 'Şifremi unuttum — Menület';
  return `<main><h1>Şifremi unuttum</h1><p class="bilgi">E-posta adresinizi yazın, şifre sıfırlama bağlantısı gönderelim.</p>
<form id="sifre-form" novalidate><label>E-posta<input name="email" type="email" required autocomplete="email"></label>
<p class="form-mesaj" role="status"></p><button class="ana-dugme">Sıfırlama bağlantısı gönder</button></form>
<div class="baglantilar">${bag('/', 'Giriş ekranına dön')}</div></main>`;
}

function sayfaPanel() {
  document.title = 'Ana sayfa — Menület';
  const yuzde = (n, t) => +(n / t * 100).toFixed(3) + '%';
  const kart = ([yol, x1, y1, x2, y2, renk]) => {
    const w = x2 - x1, h = y2 - y1;
    return `<a class="kart" href="${esc(adres(yol))}" data-yol="${yol}" aria-label="${esc(SAYFALAR[yol])}" style="left:${yuzde(x1, PANO.G)};top:${yuzde(y1, PANO.Y)};width:${yuzde(w, PANO.G)};height:${yuzde(h, PANO.Y)};background-color:${renk}"><span style="background-size:${yuzde(PANO.G, w)} ${yuzde(PANO.Y, h)};background-position:${yuzde(x1, PANO.G - w)} ${yuzde(y1, PANO.Y - h)}"></span></a>`;
  };
  const ad = S.isletme?.name || S.kullanici.email;
  return `<main class="pano-dis"><div class="pano"><h1 class="gizli">Menület — Ana sayfa</h1>
<div class="hesap pano-hesap"><button class="pano-ad" data-act="hesap-menu" aria-haspopup="true" aria-expanded="${S.menuAcik}"><span>${esc(ad)}</span></button>${S.menuAcik ? '<div class="hesap-menu"><button data-act="cikis">Çıkış yap</button></div>' : ''}</div>
<nav>${KARTLAR.map(kart).join('')}</nav></div></main>`;
}

function sayfaAlt(yol) {
  document.title = SAYFALAR[yol] + ' — Menület';
  return `<main>${bag('/panel', '← Ana sayfa', 'geri')}<h1>${SAYFALAR[yol]}</h1></main>`;
}

// Kayıt sırasında işletme oluşturulamadıysa (bağlantı koptu vb.) buradan oluşturulur.
function sayfaIsletmeYok() {
  document.title = 'İşletme oluştur — Menület';
  return `<main><h1>İşletmenizi oluşturun</h1><p class="bilgi">Hesabınıza bağlı bir işletme bulunamadı.</p>
<form id="isletme-form" novalidate><label>İşletme adı<input name="isletme" required maxlength="80" autocomplete="organization"></label>
<p class="form-mesaj" role="status"></p><button class="ana-dugme">İşletmeyi oluştur</button></form></main>`;
}

function durumEkrani() {
  if (S.durum === 'hata') return '<main><p class="form-mesaj hata">Bilgileriniz yüklenemedi. İnternet bağlantınızı kontrol edin.</p><p><button class="ana-dugme" data-act="yeniden">Tekrar dene</button></p></main>';
  return '<main><p class="bilgi">Yükleniyor…</p></main>';
}

function isletmeYukle() {
  S.durum = 'yukleniyor';
  DB.isletmeler()
    .then((l) => { S.isletme = l[0] || null; S.durum = 'hazir'; })
    .catch((e) => { console.error('İşletme okunamadı', e); S.durum = 'hata'; })
    .finally(render);
}

function render() {
  const yol = mevcutYol();
  if (yol !== sonYol) { sonYol = yol; S.menuAcik = false; }
  if (S.kullanici) { if (yol !== '/panel' && !SAYFALAR[yol]) return git('/panel', true); }
  else if (!GIRIS_SAYFALARI.includes(yol)) return git('/', true);

  let govde;
  if (!S.kullanici) govde = yol === '/kayit' ? sayfaKayit() : yol === '/sifre' ? sayfaSifre() : sayfaGiris();
  else {
    if (S.durum === 'bos') isletmeYukle();
    govde = S.durum !== 'hazir' ? durumEkrani() : !S.isletme ? sayfaIsletmeYok() : yol === '/panel' ? sayfaPanel() : sayfaAlt(yol);
  }
  const pano = S.kullanici && S.durum === 'hazir' && S.isletme && yol === '/panel';
  app.classList.toggle('tam', pano);
  app.innerHTML = (pano ? '' : ustBar()) + govde;
}

/* =====================================================================
   OLAYLAR
   ===================================================================== */
async function girisGonder(form) {
  const f = new FormData(form);
  formDurum(form, true);
  try { S.kullanici = await DB.auth.girisYap(f.get('email'), f.get('sifre')); S.durum = 'bos'; git('/panel'); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function kayitGonder(form) {
  const f = new FormData(form), ad = String(f.get('isletme') || '').trim();
  if (!ad) return formDurum(form, false, 'İşletme adını yazın.', 'hata');
  formDurum(form, true);
  try { S.kullanici = await DB.auth.kayitOl(ad, f.get('email'), f.get('sifre')); S.durum = 'bos'; git('/panel'); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function sifreGonder(form) {
  const f = new FormData(form);
  formDurum(form, true);
  try {
    await DB.auth.sifreSifirla(f.get('email'));
    formDurum(form, false, 'Bu e-posta adresiyle bir hesap varsa şifre sıfırlama bağlantısı gönderildi. Gelen kutunuzu ve istenmeyen (spam) klasörünü kontrol edin.', 'tamam');
  } catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function isletmeGonder(form) {
  const ad = String(new FormData(form).get('isletme') || '').trim();
  if (!ad) return formDurum(form, false, 'İşletme adını yazın.', 'hata');
  formDurum(form, true);
  try { await DB.isletmeOlustur(ad); S.durum = 'bos'; render(); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

document.addEventListener('submit', (e) => {
  const islem = { 'giris-form': girisGonder, 'kayit-form': kayitGonder, 'sifre-form': sifreGonder, 'isletme-form': isletmeGonder }[e.target.id];
  if (islem) { e.preventDefault(); islem(e.target); }
});

document.addEventListener('click', async (e) => {
  // Hesap menüsü açıkken dışarı tıklanırsa kapanır
  if (S.menuAcik && !e.target.closest('.hesap')) { S.menuAcik = false; render(); }
  const ln = e.target.closest('a[data-yol]');
  if (ln && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    if (!ln.classList.contains('kart')) { git(ln.dataset.yol); return; }
    // Ana sayfa kartı: gömülme efekti görünsün diye kısa bir bekleme
    if (ln.classList.contains('basili')) return;
    ln.classList.add('basili');
    setTimeout(() => git(ln.dataset.yol), 100);
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    case 'hesap-menu': if (GIRIS_ATLA) break; S.menuAcik = !S.menuAcik; render(); break;
    case 'cikis':
      await DB.auth.cikis();
      Object.assign(S, { kullanici: null, isletme: null, durum: 'bos', menuAcik: false });
      git('/');
      break;
    case 'yeniden': S.durum = 'bos'; render(); break;
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.menuAcik) { S.menuAcik = false; render(); } });
window.addEventListener('popstate', render);
window.addEventListener('hashchange', render);

// GEÇİCİ: giriş ekranı atlanıyor, "cabbar" işletmesi doğrudan açılıyor. Giriş tekrar açılınca false yapılacak.
const GIRIS_ATLA = true;
if (GIRIS_ATLA) Object.assign(S, { kullanici: { uid: 'deneme', email: '' }, isletme: { name: 'cabbar' }, durum: 'hazir' });
else S.kullanici = await DB.auth.hazir();
render();
</script>
</body>
</html>
