<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menület</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="Menület">
<style>
/* Geçici sade görünüm: asıl tasarım sonra gelecek */
:root{--zemin:#fae9db;--yazi:#222222;--soluk:#6b6b6b;--cizgi:#dddddd;--kutu:#f4f4f4;--vurgu:#50344c;--vurgu-yazi:#ffffff;--hata:#b3261e;--tamam:#1d6b3a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--zemin);color:var(--yazi);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#root{max-width:30rem;margin:0 auto;padding:0 1rem 2rem;min-height:100vh}
@media(min-width:64em){#root{max-width:60rem}}
.ust{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem 0;border-bottom:.0625rem solid var(--cizgi);margin-bottom:1.5rem}
.marka{font-weight:700;font-size:1.25rem;text-decoration:none;flex-shrink:0}
.ust-sag{display:flex;align-items:center;gap:.5rem;min-width:0}
.hesap{position:relative;min-width:0}
.isletme-adi{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:.0625rem solid var(--cizgi);border-radius:.5rem;padding:.5rem .75rem;min-height:2.75rem}
.hesap-menu{position:absolute;right:0;top:calc(100% + .25rem);background:var(--zemin);border:.0625rem solid var(--cizgi);border-radius:.5rem;padding:.25rem;z-index:10;min-width:100%}
.hesap-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:.6rem .75rem;white-space:nowrap;min-height:2.75rem}
h1{font-size:1.6rem;margin:0 0 1rem}
form{display:grid;gap:1rem}
label{display:grid;gap:.35rem;font-weight:600}
input{width:100%;padding:.75rem;border:.0625rem solid var(--cizgi);border-radius:.5rem;background:var(--zemin)}
.ana-dugme{background:var(--vurgu);color:var(--vurgu-yazi);border:0;border-radius:.5rem;padding:.8rem 1rem;font-weight:700;min-height:2.75rem}
.baglantilar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;margin-top:1.25rem}
.baglantilar a{padding:.5rem 0}
.form-mesaj{margin:0;padding:.75rem;border-radius:.5rem;background:var(--kutu)}
.form-mesaj:empty{display:none}
.form-mesaj.hata{color:var(--hata)}
.form-mesaj.tamam{color:var(--tamam)}
.gizli{position:absolute;width:.0625rem;height:.0625rem;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.geri{display:inline-block;margin-bottom:1rem;padding:.5rem 0}
.bilgi{color:var(--soluk)}
/* ===== Ana sayfa: tek görsel; kartlar aynı görselin parçalarını gösterir (görsel dosyada bir kez var) ===== */
#root.tam{max-width:30rem;padding:0}
.gecis{position:relative;z-index:1;margin:0 -1rem;padding:0 1rem;background:var(--zemin);min-height:100vh;min-height:100dvh;animation:.25s ease-out .05s both} /* 0,05 sn gecikmeyle başlar */
.gecis.sol{animation-name:soldan}
.gecis.sag{animation-name:sagdan}
@keyframes soldan{from{transform:translateX(-100%)}}
@keyframes sagdan{from{transform:translateX(100%)}}
.kapanan{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none;background:var(--zemin);animation:.25s ease-in both}
.kapanan.sol{animation-name:sola}
.kapanan.sag{animation-name:saga}
.kapanan>div{max-width:30rem;margin:0 auto;padding:0 1rem}
@media(min-width:64em){.kapanan>div{max-width:60rem}}
@keyframes sola{to{transform:translateX(-100%)}}
@keyframes saga{to{transform:translateX(100%)}}
/* ===== Tasarım Düzenle sayfası: ölçüler sayfa genişliğine oranlı (cqw), görselle aynı oranlar ===== */
#root.dar{max-width:30rem;padding:0}
#root.dar .gecis{margin:0;padding:0}
.kapanan>div.dar{max-width:30rem;padding:0}
.td-dis{container-type:inline-size;background:#fbf1e8;height:100vh;height:100dvh;overflow:hidden}
#root.dar .gecis{background:#fbf1e8}
.kapanan:has(>div.dar){background:#fbf1e8}
.td{--bakir:#b8693a;--koyu:#2b1d16;--soluk2:#7d6558;--kart:#f9f0e7;--kutu2:#f6e8dc;--ikon:#7b432b;padding:1.6cqw 3.2cqw 0;color:var(--koyu);font-size:2.3cqw;height:100%;display:flex;flex-direction:column}
:where(.td button){font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.td svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.td-ust{display:flex;align-items:center;gap:2.5cqw;padding:.6cqw 0 2cqw}
.td-geri{display:grid;place-items:center;width:7cqw;height:7cqw;margin-left:-.6cqw;color:var(--koyu)}
.td-geri svg{width:5.4cqw;height:5.4cqw}
.td-ust-dugmeler{margin-left:auto;display:flex;align-items:center;gap:1.6cqw}
.td-ust-dugme{display:flex;align-items:center;gap:1.2cqw;height:8cqw;padding:0 2.6cqw;border-radius:99rem;background:#f8e4d5!important;font-size:2.55cqw!important;font-weight:500;white-space:nowrap}
.td-ust-dugme svg{width:3.6cqw;height:3.6cqw;color:var(--ikon)}
.td-ust-dugme.kaydet{background:linear-gradient(180deg,#c47b55,#9b5c3e)!important;color:#fff!important;font-weight:600;box-shadow:0 .5cqw 1.2cqw rgba(120,60,30,.3)}
.td-ust-dugme.kaydet svg{width:3.8cqw;height:3.8cqw;stroke-width:2.4}
.td-onizleme{position:relative;height:65.3cqw;border-radius:4.7cqw;background:#f3e4d7;overflow:hidden;margin:0 -.6cqw}
.td-kaydir{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.td-kaydir::-webkit-scrollbar{display:none}
.td-sayfa{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.td-cerceve{position:absolute;top:0;left:0;width:23.4375rem;height:calc(100% / var(--olcek,1));border:0;transform:scale(var(--olcek,1));transform-origin:0 0;pointer-events:none;background:#fffaf4}
.td-kartlar{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0 -3.2cqw;padding:.4cqw 3.2cqw 3.2cqw}
.td-kartlar::-webkit-scrollbar{display:none}
.td-kartlar.detayli::after{content:"";display:block;height:75vh;height:75dvh}
.td-ust,.td-onizleme,.td-noktalar{flex:none}
.td-kartlar>.td-bolum:first-child{margin-top:0}
.td-bolum{cursor:pointer}
.td-ac svg{transition:transform .25s ease}
.td-bolum.acik .td-ac svg{transform:rotate(90deg)}
.td-detay{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;cursor:default}
.td-bolum.acik .td-detay{grid-template-rows:1fr}
.td-bolum.anlik .td-detay{transition:none}
.td-detay-ic{min-height:0;overflow:hidden}
.td-detay-icerik{margin-top:2.6cqw;padding-top:2.4cqw;border-top:.25cqw solid #efdccd}
.td-satir{display:flex;align-items:center;gap:3cqw;padding:1.4cqw 0;cursor:pointer;font-weight:400}
.td-satir input[type=color]{flex:none;width:9cqw;height:9cqw;padding:0;border:0;border-radius:2cqw;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;box-shadow:0 0 0 .25cqw rgba(60,30,10,.12)}
.td-satir input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.td-satir input[type=color]::-webkit-color-swatch{border:0;border-radius:2cqw}
.td-satir input[type=color]::-moz-color-swatch{border:0;border-radius:2cqw}
.td-satir b{display:block;font-size:2.6cqw;font-weight:600}
.td-satir small{display:block;margin-top:.3cqw;font-size:2.15cqw;color:var(--soluk2)}
.td-satir.ana{padding-bottom:2.4cqw;border-bottom:.25cqw solid #efdccd}
.td-ara{margin:2.6cqw 0 .4cqw;font-size:2cqw;font-weight:600;color:var(--soluk2);text-transform:uppercase;letter-spacing:.08em}
.td-uyari{margin:1.6cqw 0 0;padding:1.8cqw 2.4cqw;border-radius:1.6cqw;background:#fbe4d6;color:#94391b;font-size:2.2cqw;line-height:1.5}
.td-uyari:empty{display:none}
.td-yazi-alan{display:grid;gap:1.2cqw;margin:0;font-size:2.3cqw;font-weight:600}
.td-yazi-alan+.td-yazi-alan{margin-top:2.4cqw}
.td-yazi-alan input{width:100%;font:inherit;font-weight:400;font-size:1rem;padding:2cqw 2.6cqw;border:.25cqw solid #e6cfbd;border-radius:1.8cqw;background:#fffdf9;color:var(--koyu)}
.td-yazi-alan input:focus{outline:none;border-color:var(--bakir)}
.td-bos{margin:0;font-size:2.3cqw;color:var(--soluk2)}
.td-noktalar{display:flex;justify-content:center;gap:1.6cqw;margin:2.2cqw 0 .4cqw}
.td-noktalar button{width:2cqw;height:2cqw;border-radius:99rem;background:#e2cbb9!important;transition:width .2s ease,background-color .2s ease}
.td-noktalar button.aktif{width:5.2cqw;background:var(--bakir)!important}
.td-telefon{position:absolute;left:8.6cqw;right:8.6cqw;top:4cqw;bottom:0;border-radius:8.5cqw 8.5cqw 0 0;background:#151314;padding:1.6cqw 1.6cqw 0;box-shadow:0 0 0 .5cqw #d9d4d0,0 1.5cqw 3cqw rgba(60,30,10,.25)}
.td-ekran{position:relative;height:100%;border-radius:7cqw 7cqw 0 0;overflow:hidden;background:#f6e9de}
.td-bolum{display:grid;grid-template-columns:10cqw 1fr 7cqw;column-gap:3.6cqw;align-items:start;margin-top:2.3cqw;padding:2.2cqw 2.2cqw 2.4cqw 2.7cqw;border-radius:3.5cqw;background:var(--kart);box-shadow:0 .3cqw 1.2cqw rgba(120,70,40,.08)}
.td-ikon{grid-row:span 2;display:grid;place-items:center;width:10cqw;height:10cqw;border-radius:2.3cqw;background:#f8e2d2;color:var(--ikon)}
.td-ikon svg{width:5.6cqw;height:5.6cqw}
.td-ikon .yazi-ikon{font:400 5.4cqw/1 Georgia,serif}
.td-baslik{margin:.6cqw 0 0;font-size:3.05cqw;font-weight:700}
.td-aciklama{grid-column:2;margin:.4cqw 0 0;font-size:2.25cqw;color:var(--soluk2)}
.td-ac{grid-column:3;grid-row:1/span 2;display:grid;place-items:center;width:7cqw;height:7cqw;border-radius:50%;background:linear-gradient(180deg,#b97752,#965a3e)!important;color:#fff!important;box-shadow:0 .5cqw 1.2cqw rgba(120,60,30,.3)}
.td-ac svg{width:3.4cqw;height:3.4cqw;stroke-width:2.6}
.td-secenekler{grid-column:2/4;display:flex;gap:1.8cqw;margin-top:2.6cqw}
.td-sec{position:relative;flex:1;min-width:0;border-radius:1.4cqw;background:var(--kutu2)!important;outline:.3cqw solid transparent;outline-offset:-.3cqw}
.td-sec.secili{outline-color:var(--bakir);background:#fbf3ec!important}
.td-renk{aspect-ratio:1.42;padding:.55cqw!important}
.td-renk.secili{background:#eecdb5!important}
.td-renk span{position:relative;display:block;height:100%;border-radius:.9cqw;overflow:hidden}
.td-renk span::after{content:"";position:absolute;right:0;bottom:0;width:50%;height:100%;background:var(--b)}
.td-renk span.ceyrek::after{height:55%}
.td-yazi{height:9.4cqw;display:grid;place-content:center;gap:.4cqw;text-align:center}
.td-yazi b{font-weight:400;font-size:4cqw;line-height:1}
.td-yazi small{font-size:1.9cqw;color:var(--soluk2)}
.td-yazi.secili small{color:var(--koyu)}
.td-gorseller{grid-column:2/4;display:flex;gap:1.5cqw;margin-top:2.6cqw}
.td-logo,.td-kapak-kucuk{position:relative;height:9.6cqw;border-radius:1.4cqw}
.td-logo{width:12.9cqw;display:grid;place-items:center;background:#ece0d6!important}
.td-logo span{display:grid;place-items:center;width:9.4cqw;height:9.4cqw;border-radius:50%;background:#2a1a12;box-shadow:inset 0 0 0 .5cqw #c98250;color:#e2a46f}
.td-logo span svg{width:4.6cqw;height:4.6cqw}
.td-kapak-kucuk{width:39cqw;background:radial-gradient(ellipse at 62% 60%,#7a3b1d 0,#3a1c10 40%,transparent 70%),linear-gradient(90deg,#1e130d,#2a1810)!important}
.td-kalem{position:absolute;right:-.6cqw;bottom:-.6cqw;display:grid;place-items:center;width:4.4cqw;height:4.4cqw;border-radius:50%;background:#fff;color:var(--koyu);box-shadow:0 .2cqw .8cqw rgba(0,0,0,.25)}
.td-kalem svg{width:2.3cqw;height:2.3cqw}
.td-gorunum{height:9cqw;display:flex;align-items:center;gap:1.2cqw;padding:0 1.4cqw!important;text-align:left;font-size:1.85cqw;line-height:1.25}
.td-gorunum svg{flex:none;width:4cqw;height:4cqw;color:var(--ikon)}
.td-gorunum svg.kucuk{width:2.9cqw;height:2.9cqw}

<script type="module">
/* =====================================================================
   MENÜLET
   Adresler: / (giriş) · /kayit · /sifre · /panel · /tasarim-sec · /tasarim-duzenle · /kategoriler · /urunler · /gorseller · /yayinla · /hizli-urun · /hizli-fiyat

   Veri yapısı (Firestore):
     users/{uid}                     { email, created }
     businesses/{isletmeId}          { owner (uid), name, created, updated }
     businesses/{isletmeId}/...      alt koleksiyonlar (categories, products, images…) sonraki aşamalarda
   Fotoğraflar (Storage): users/{uid}/<dosya>
   ===================================================================== */

// --- Firebase bağlantısı ---
const FB_TEMEL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const firebaseConfig = {
  apiKey: 'AIzaSyD9axc9mKz0VXOXL9z3ovcNRiYP28nh1bY',
  authDomain: 'menulet-3edcd.firebaseapp.com',
  projectId: 'menulet-3edcd',
  storageBucket: 'menulet-3edcd.firebasestorage.app',
  messagingSenderId: '742666635212',
  appId: '1:742666635212:web:4bf17528936bcfacd2bf69',
};
// Site GitHub Pages'te alt klasörde yayınlanır (kullanici.github.io/menulet/). TABAN o klasördür.
// Kendi alan adı bağlanırsa ya da yerelde açılırsa kök ('/') kullanılır.
const TABAN = (() => {
  if (!location.hostname.endsWith('.github.io')) return '/';
  const ilk = location.pathname.split('/')[1];
  return ilk ? '/' + ilk + '/' : '/';
})();
// GEÇİCİ: giriş ekranı atlanıyor, "cabbar" işletmesi doğrudan açılıyor ve Firebase hiç yüklenmiyor. Giriş tekrar açılınca false yapılacak.
const GIRIS_ATLA = true;
let FB = null; // yüklenemezse (internet yok) site açılır ama giriş çalışmaz
// Önce Google'ın sunucusu, olmazsa sitenin kendi kopyası (depoya fb klasörü eklenirse) denenir.
const YEREL_FB = location.protocol === 'file:' ? './fb/' : TABAN + 'fb/';
const FB_DOSYALAR = ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js', 'firebase-storage.js'];
for (const temel of GIRIS_ATLA ? [] : [FB_TEMEL, YEREL_FB]) {
  try {
    const [uygulama, kimlik, veritabani, depo] = await Promise.all(FB_DOSYALAR.map((d) => import(temel + d)));
    const fbApp = uygulama.initializeApp(firebaseConfig);
    FB = { au: kimlik, fs: veritabani, st: depo, auth: kimlik.getAuth(fbApp), db: veritabani.getFirestore(fbApp), storage: depo.getStorage(fbApp) };
    FB.auth.languageCode = 'tr'; // şifre sıfırlama e-postası Türkçe gelsin
    break;
  } catch (e) { console.error('Firebase yüklenemedi:', temel, e); }
}

/* =====================================================================
   VERİ KATMANI
   ===================================================================== */
const DB = (() => {
  const simdi = () => new Date().toISOString();
  const hata = (code) => Object.assign(new Error(code), { code });
  const fb = () => { if (!FB) throw hata('auth/network-request-failed'); return FB; };
  let aktif = null; // { uid, email }

  async function isletmeler() {
    const { fs, db } = fb();
    if (!aktif) throw hata('permission-denied');
    const sn = await fs.getDocs(fs.query(fs.collection(db, 'businesses'), fs.where('owner', '==', aktif.uid)));
    return sn.docs.map((d) => ({ ...d.data(), id: d.id })).sort((a, b) => String(a.created).localeCompare(String(b.created)));
  }

  // --- Storage yardımcıları ---
  // Dosya adresi tutabilecek alanlar: işletme belgesinde ve işletmenin alt koleksiyonlarında
  const ISLETME_DOSYA_ALANLARI = ['logo', 'cover'];
  const ALT_KOLEKSIYONLAR = ['categories', 'products', 'images'];
  const DOSYA_ALANLARI = ['photo', 'image'];
  const bizimDosya = (url) => typeof url === 'string' && url.startsWith('https://firebasestorage.googleapis.com/') && url.includes('/b/' + firebaseConfig.storageBucket + '/');

  async function dosyaYukle(blob, uzanti) {
    const { st, storage } = fb();
    if (!aktif) throw hata('permission-denied');
    const ad = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.' + uzanti;
    const ref = st.ref(storage, `users/${aktif.uid}/${ad}`);
    await st.uploadBytes(ref, blob, { contentType: blob.type, cacheControl: 'public, max-age=31536000' });
    return st.getDownloadURL(ref);
  }

  // Dosyayı başka bir kayıt hâlâ kullanıyor mu? Emin olunamazsa "kullanılıyor" sayılır (silinmez).
  async function kullaniliyor(url) {
    const { fs, db } = fb();
    try {
      for (const b of await isletmeler()) {
        if (ISLETME_DOSYA_ALANLARI.some((a) => b[a] === url)) return true;
        for (const k of ALT_KOLEKSIYONLAR) for (const a of DOSYA_ALANLARI) {
          const q = fs.query(fs.collection(db, 'businesses', b.id, k), fs.where(a, '==', url), fs.limit(1));
          if ((await fs.getDocs(q)).size) return true;
        }
      }
      return false;
    } catch (e) { console.error('Dosya kullanımı denetlenemedi', e); return true; }
  }

  // Artık hiçbir kayıtta geçmeyen dosyaları Storage'dan siler. Hata olursa sessizce geçer.
  async function dosyaTemizle(urller) {
    if (!FB || !aktif) return;
    for (const url of [...new Set(urller || [])].filter(bizimDosya)) {
      try { if (!(await kullaniliyor(url))) await FB.st.deleteObject(FB.st.ref(FB.storage, url)); }
      catch (e) { if (e?.code !== 'storage/object-not-found') console.error('Dosya silinemedi', e); }
    }
  }

  // Fotoğrafı tarayıcıda küçültüp WebP'ye çevirir (varsayılan ~250 KB altı), Storage'a yükler, indirme adresini döndürür.
  // Cihazın okuyamadığı dosyalarda 'foto-okunamadi' hatası verir.
  async function fotoYukle(file, kb = 250, kenarSnr = 1600) {
    const HEDEF = kb * 1024;
    let kaynak = null;
    try { kaynak = await createImageBitmap(file); }
    catch {
      kaynak = await new Promise((ok, no) => {
        const url = URL.createObjectURL(file); const i = new Image();
        i.onload = () => { URL.revokeObjectURL(url); ok(i); };
        i.onerror = () => { URL.revokeObjectURL(url); no(); };
        i.src = url;
      }).catch(() => null);
    }
    if (!kaynak || !(kaynak.width > 0)) throw hata('foto-okunamadi');
    const deneme = document.createElement('canvas');
    const webp = deneme.toDataURL('image/webp').startsWith('data:image/webp');
    const tip = webp ? 'image/webp' : 'image/jpeg'; // eski tarayıcılarda JPEG'e düşer
    let olcek = Math.min(1, kenarSnr / Math.max(kaynak.width, kaynak.height));
    let blob = null;
    for (let tur = 0; tur < 8; tur++) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(kaynak.width * olcek));
      c.height = Math.max(1, Math.round(kaynak.height * olcek));
      const g = c.getContext('2d');
      if (!webp) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(kaynak, 0, 0, c.width, c.height);
      for (const kalite of [0.85, 0.75, 0.65, 0.55, 0.45, 0.35]) {
        blob = await new Promise((ok) => c.toBlob(ok, tip, kalite));
        if (!blob) throw hata('foto-okunamadi');
        if (blob.size <= HEDEF) break;
      }
      if (blob.size <= HEDEF) break;
      olcek *= 0.8;
    }
    if (kaynak.close) kaynak.close();
    return dosyaYukle(blob, webp ? 'webp' : 'jpg');
  }

  return {
    auth: {
      async hazir() {
        if (!FB) return null;
        const u = await new Promise((ok) => { const kapat = FB.au.onAuthStateChanged(FB.auth, (x) => { kapat(); ok(x); }); });
        aktif = u ? { uid: u.uid, email: u.email || '' } : null;
        return aktif;
      },
      async girisYap(email, sifre) {
        const { au, auth } = fb();
        const c = await au.signInWithEmailAndPassword(auth, String(email).trim(), String(sifre));
        aktif = { uid: c.user.uid, email: c.user.email || '' };
        return aktif;
      },
      // Hesabı açar; kullanıcı belgesi ve işletme kaydı tek işlemde birlikte yazılır.
      async kayitOl(isletmeAdi, email, sifre) {
        const { au, fs, auth, db } = fb();
        const c = await au.createUserWithEmailAndPassword(auth, String(email).trim(), String(sifre));
        aktif = { uid: c.user.uid, email: c.user.email || '' };
        const batch = fs.writeBatch(db);
        batch.set(fs.doc(db, 'users', aktif.uid), { email: aktif.email, created: simdi() });
        batch.set(fs.doc(fs.collection(db, 'businesses')), { owner: aktif.uid, name: isletmeAdi, created: simdi(), updated: simdi() });
        try { await batch.commit(); } catch (e) { console.error('İşletme kaydı oluşturulamadı', e); } // panelde tekrar oluşturulabilir
        return aktif;
      },
      async sifreSifirla(email) {
        const { au, auth } = fb();
        try { await au.sendPasswordResetEmail(auth, String(email).trim()); }
        catch (e) { if (e.code !== 'auth/user-not-found') throw e; } // hesap var/yok bilgisini sızdırma
      },
      async cikis() { if (FB) await FB.au.signOut(FB.auth); aktif = null; },
    },
    isletmeler,
    async isletmeOlustur(ad) {
      const { fs, db } = fb();
      if (!aktif) throw hata('permission-denied');
      await fs.addDoc(fs.collection(db, 'businesses'), { owner: aktif.uid, name: ad, created: simdi(), updated: simdi() });
    },
    fotoYukle,
    dosyaTemizle,
  };
})();

// Temiz adresler: https üzerinde /panel gibi; dosya (file:) olarak açılırsa #/ sistemi kullanılır.
const TEMIZ = /^https?:$/.test(location.protocol);
// Bazı ortamlar (ör. önizleme pencereleri) adres değiştirmeye izin vermez; o zaman sayfa bellekte tutulur.
let bellekYol = null;
const adresYaz = (yontem, url, yol) => { try { history[yontem](null, '', url); } catch { bellekYol = yol; } };
if (TEMIZ && location.hash.startsWith('#/')) adresYaz('replaceState', TABAN + location.hash.slice(2), location.hash.slice(1)); // eski #/ adreslerini çevir
const tabanSiz = (p) => {
  if (p === TABAN.slice(0, -1)) return '/';
  const y = p.startsWith(TABAN) ? '/' + p.slice(TABAN.length) : p;
  return y === '/index.html' || y === '/404.html' ? '/' : y.length > 1 && y.endsWith('/') ? y.slice(0, -1) : y;
};
const mevcutYol = () => bellekYol ?? (location.hash.startsWith('#/') ? location.hash.slice(1) : TEMIZ ? tabanSiz(location.pathname || '/') : '/');
const adres = (yol) => (TEMIZ ? TABAN + yol.slice(1) : '#' + yol);
const bag = (yol, metin, sinif = '') => `<a href="${esc(adres(yol))}" data-yol="${yol}"${sinif ? ` class="${sinif}"` : ''}>${metin}</a>`;
function git(yol, degistir = false) {
  if (mevcutYol() !== yol) { if (bellekYol !== null) bellekYol = yol; else adresYaz(degistir ? 'replaceState' : 'pushState', adres(yol), yol); }
  render(); window.scrollTo(0, 0);
}

const gomuluHtml = (ad) => document.getElementById('gomulu-' + ad)?.textContent.replaceAll('<\\/script>', '<' + '/script>');
const tsGorsel = (ad) => GOMULU[ad] || TASARIM_KLASOR + ad;

function tsMini(t) {
  const urun = ([zemin, emoji, ad, fiyat]) => `<div class="mini-item"><div class="mini-food" style="background:${zemin}">${emoji}</div><div class="mini-lines"><b>${ad}</b><i></i></div><div class="mini-price"${t.fiyat ? ` style="color:${t.fiyat}"` : ''}>${fiyat}</div></div>`;
  return `<div class="mini-menu" style="background:${t.renk[1]};color:${t.renk[2]}"><div class="mini-hero" style="${t.kapak}"><div class="mini-logo">${t.logo}</div><div class="mini-title">${t.baslik}</div><div class="mini-sub">${t.altYazi}</div></div>`
    + `<div class="mini-body"><div class="mini-category"${t.bolum[1] ? ` style="color:${t.bolum[1]}"` : ''}>${t.bolum[0]}</div>${t.urunler.map(urun).join('')}</div></div>`;
}

function sayfaTasarimSec() {
  document.title = 'Tasarım Seç — Menület';
  const s = tsBul(TSD.secili) || TASARIMLAR[0];
  const kart = (t) => `<article class="design${t.no === s.no ? ' selected' : ''}" data-no="${t.no}"${TSD.kat !== 'all' && TSD.kat !== t.kat ? ' style="display:none"' : ''}>
<div class="preview" style="background:${t.renk[0]}" data-act="ts-onizle" data-no="${t.no}">${t.gorsel ? `<img src="${tsGorsel(t.gorsel)}" alt="${t.ad} tasarımı" loading="lazy">` : tsMini(t)}</div>
<div class="design-meta" data-act="ts-sec" data-no="${t.no}"><span class="number">${t.no}</span><div class="meta-text"><strong>${t.ad}</strong><small>${t.alt}</small></div><button class="preview-btn" type="button" data-act="ts-onizle" data-no="${t.no}">Önizle</button><span class="check">✓</span></div></article>`;
  return `<main class="ts">
<header class="topbar">${bag('/panel', '‹', 'back')}<div class="heading"><h1>Tasarım Seç</h1><p>Menüne en uygun görünümü seç.</p></div><div class="brand">Menület</div></header>
<section class="controls"><label class="select-label" for="categorySelect">Tasarım kategorisi</label><div class="select-wrap"><select id="categorySelect">${TS_KATEGORILER.map(([v, ad]) => `<option value="${v}"${v === TSD.kat ? ' selected' : ''}>${ad}</option>`).join('')}</select></div></section>
<section class="grid" aria-label="Menü tasarımları">${TASARIMLAR.map(kart).join('')}</section>
<footer class="bottom"><div class="chosen"><small>Seçili tasarım</small><strong id="chosenName">${s.no} · ${s.ad}</strong></div><button class="continue" data-act="ts-onayla">Bu tasarımı seç →</button></footer>
</main>`;
}

function tsSec(no) {
  const t = tsBul(no); if (!t) return;
  TSD.secili = no;
  document.querySelectorAll('.ts .design').forEach((c) => c.classList.toggle('selected', c.dataset.no === no));
  const ad = document.getElementById('chosenName'); if (ad) ad.textContent = t.no + ' · ' + t.ad;
}

function tsOnizle(no) {
  const t = tsBul(no); if (!t) return;
  tsKapat();
  const m = document.createElement('div');
  m.className = 'ts-modal modal open'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.dataset.act = 'ts-kapat';
  // Gerçek dosyası olan tasarım tam ekran ve kendi çerçevesinde açılır (stilleri sitemizi etkilemez)
  const govde = t.html ? `<iframe title="${t.ad} önizlemesi"></iframe>` : `<div class="preview" style="background:${t.renk[0]};height:25rem;border-radius:.8125rem">${tsMini(t)}</div>`;
  m.innerHTML = `<div class="modal-card${t.html ? ' tam' : ''}"><div class="modal-head"><strong>${t.no} · ${t.ad}</strong><button class="modal-close" data-act="ts-kapat" aria-label="Kapat">×</button></div><div class="modal-body">${govde}</div><div class="modal-foot"><button data-act="ts-modal-sec" data-no="${t.no}">Bu tasarımı seç</button></div></div>`;
  if (t.html) { const f = m.querySelector('iframe'), ic = gomuluHtml(t.html); if (ic) f.srcdoc = ic; else f.src = TASARIM_KLASOR + t.html; }
  document.body.append(m); document.body.style.overflow = 'hidden';
}
function tsKapat() { document.querySelector('.ts-modal')?.remove(); document.body.style.overflow = ''; }

function tsBildirim(metin) {
  document.querySelector('.ts-bildirim')?.remove();
  const b = document.createElement('div'); b.className = 'ts-bildirim'; b.setAttribute('role', 'status'); b.textContent = metin;
  document.body.append(b); setTimeout(() => b.remove(), 2000);
}

  ['Yuvarlak', "ui-rounded,'SF Pro Rounded','Coming Soon',casual,'Comic Sans MS',sans-serif", ''],
];
const TD_GORUNUMLER = [['Fotoğraflı<br>Kart', 'resim'], ['Sade Liste', 'liste'], ['Büyük<br>Fotoğraf', 'resim'], ['Küçük<br>Fotoğraf', 'resim', 'kucuk']];

const TD = { tasarim: null, palet: 0, renk: null, metin: {}, yazi: -1, gorunum: 0, acik: null, gecmis: false };
const TD_RENK_ADLARI = [['k', 'Kapak', 'Üst görsel ve alt alan'], ['z', 'Zemin', 'Sayfanın arka planı'], ['y', 'Yazı', 'Başlıklar ve ürün yazıları'], ['v', 'Vurgu', 'Fiyatlar, çizgiler ve etiketler']];

// Seçili tasarımın düzenleme ayarı yoksa (henüz hazırlanmadıysa) ilk tasarım kullanılır
const tdTasarim = () => { const t = tsBul(TSD.secili); return t?.duzen ? t : TASARIMLAR[0]; };
function tdHazirla() {
  const t = tdTasarim();
  if (TD.tasarim === t.no) return;
  const p = t.duzen.renkler[0];
  Object.assign(TD, { tasarim: t.no, palet: 0, renk: { k: p.k, z: p.z, y: p.y, v: p.v }, metin: Object.fromEntries(t.duzen.yazilar.map((y) => [y.anahtar, y.varsayilan])) });
}

// --- Renk hesapları ---
const hexRgb = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
const rgbHex = (c) => '#' + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const karis = (a, b, p) => a.map((v, i) => v * p + b[i] * (1 - p));
const isik = (c) => { const [r, g, b] = c.map((v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const kontrast = (a, b) => { const x = isik(a), y = isik(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function rgbHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const en = Math.max(r, g, b), az = Math.min(r, g, b), l = (en + az) / 2, d = en - az;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = en === r ? ((g - b) / d) % 6 : en === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
function hslRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [r, g, b].map((v) => (v + m) * 255);
}
// Tek renkten uyumlu dörtlü: ana renk vurgu olur, kapak/yazı onun çok koyu, zemin çok açık tonu
function anaRenktenPalet(hex) {
  const [h, s, l] = rgbHsl(hexRgb(hex));
  return {
    k: rgbHex(hslRgb(h, Math.min(s, 0.35) * 0.7, 0.12)),
    z: rgbHex(hslRgb(h, Math.min(s, 0.6) * 0.55, 0.975)),
    y: rgbHex(hslRgb(h, Math.min(s, 0.3) * 0.5, 0.13)),
    v: rgbHex(hslRgb(h, s, Math.min(0.52, Math.max(0.36, l)))),
  };
}
function renkUyarilari(r) {
  const [k, z, y, v] = [r.k, r.z, r.y, r.v].map(hexRgb);
  const u = [];
  if (kontrast(y, z) < 4.5) u.push('Ürün yazıları zeminde okunmayabilir.');
  if (kontrast(karis(v, hexRgb('#fffaf0'), 0.15), k) < 4.5) u.push('Kapaktaki ve alt kısımdaki yazılar okunmayabilir.');
  if (kontrast(karis(v, y, 0.88), karis(z, [255, 255, 255], 0.5)) < 3) u.push('Fiyatlar okunmayabilir.');
  return u.join(' ');
}

// --- Önizleme: üç telefon, aynı tasarımın farklı bölümleri ---
function tdOnizlemeSayfalari() {
  return [0, 1, 2].map((i) => `<div class="td-sayfa"><div class="td-telefon"><div class="td-ekran"><iframe class="td-cerceve" data-i="${i}" title="Önizleme ${i + 1}" tabindex="-1" aria-hidden="true"></iframe></div></div></div>`).join('');
}
let tdGozlem = null;
function tdKur() {
  const t = tdTasarim(), ic = gomuluHtml(t.html);
  document.querySelectorAll('.td-cerceve').forEach((f) => {
    f.addEventListener('load', () => tdCerceveUygula(f));
    if (ic) f.srcdoc = ic; else f.src = TASARIM_KLASOR + t.html;
  });
  tdGozlem?.disconnect();
  const ekran = document.querySelector('.td-ekran');
  if (ekran && window.ResizeObserver) { tdGozlem = new ResizeObserver(tdOlcek); tdGozlem.observe(ekran); }
  tdOlcek();
}
// Menü, telefon genişliğinde (23.4375rem) çizilip ekrana sığacak kadar küçültülür
function tdOlcek() {
  const o = document.querySelector('.td-onizleme'), e = o?.querySelector('.td-ekran'), f = o?.querySelector('.td-cerceve');
  if (!e || !f || !f.offsetWidth) return;
  o.style.setProperty('--olcek', e.clientWidth / f.offsetWidth);
  tdTumunuUygula(); // ekran boyu değişince bölüm konumları yeniden hesaplanır
}
// Ayarlar menüye mesajla gönderilir; menü kendi içinde uygular (her ortamda çalışır)
function tdCerceveUygula(f) {
  f.contentWindow?.postMessage({ menulet: 1, renk: TD.renk, ad: S.isletme?.name || '', metin: TD.metin, font: TD_YAZILAR[TD.yazi]?.[1] || '', gorunum: tdTasarim().duzen.gorunumler[+f.dataset.i] }, '*');
}
const tdTumunuUygula = () => document.querySelectorAll('.td-cerceve').forEach(tdCerceveUygula);

// Varsayılana Dön: tasarımın ilk hâli; sayfa yeniden çizilmeden kutular ve önizleme güncellenir
function tdVarsayilan() {
  TD.tasarim = null; tdHazirla();

function tdOnizle() {
  const t = tdTasarim();

// Renk değişince: önizleme, detaydaki kutular, palet işareti ve uyarı birlikte güncellenir
function tdRenkGuncelle() {
  tdTumunuUygula();
  document.querySelectorAll('[data-td-renk]').forEach((i) => { i.value = TD.renk[i.dataset.tdRenk]; });
  const ana = document.querySelector('[data-td-ana]'); if (ana) ana.value = TD.renk.v;

}

// --- Kart detayları ---
function tdKaydir(k, hedef) {
  const bas = k.scrollTop, fark = hedef - bas, t0 = performance.now();
  const adim = (t) => {
    const p = Math.min(1, (t - t0) / 250), e = p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
    k.scrollTop = bas + fark * e;
    if (p < 1) requestAnimationFrame(adim);
  };
  requestAnimationFrame(adim);
}
function tdDetayAc(id) {
  const k = document.querySelector('.td-kartlar'), kart = k?.querySelector(`.td-bolum[data-bolum="${id}"]`);
  if (!kart) return;
  if (TD.acik === id) { tdDetayKapatIstek(); return; }
  if (TD.acik) {
    // Başka bir detay açıksa anında kapanır, yeni kartın kayması karışmasın
    const eski = k.querySelector(`.td-bolum[data-bolum="${TD.acik}"]`);
    if (eski) { eski.classList.add('anlik'); eski.classList.remove('acik'); void eski.offsetHeight; eski.classList.remove('anlik'); }
  } else {
    // Geri tuşu önce detayı kapatsın diye geçmişe bir adım eklenir
    try { history.pushState({ tdDetay: true }, '', location.href); TD.gecmis = true; } catch { TD.gecmis = false; }
  }
  TD.acik = id;
  k.classList.add('detayli');
  kart.classList.add('acik');
  tdKaydir(k, kart.offsetTop - k.clientWidth * 0.012);
}
function tdDetayKapat() {
  const k = document.querySelector('.td-kartlar');
  k?.querySelector('.td-bolum.acik')?.classList.remove('acik');
  TD.acik = null;
  setTimeout(() => { if (!TD.acik) k?.classList.remove('detayli'); }, 260);
}
function tdDetayKapatIstek() { if (TD.gecmis) history.back(); else tdDetayKapat(); }

function sayfaTasarimDuzenle() {

  const renkDetay = `<label class="td-satir ana"><input type="color" data-td-ana value="${TD.renk.v}"><span><b>Ana renk</b><small>Seçince diğer renkler otomatik ayarlanır.</small></span></label>
<p class="td-ara">Renkleri tek tek düzenle</p>
${TD_RENK_ADLARI.map(([a, ad, ac]) => `<label class="td-satir"><input type="color" data-td-renk="${a}" value="${TD.renk[a]}"><span><b>${ad}</b><small>${ac}</small></span></label>`).join('')}
<p class="td-uyari" role="status">${renkUyarilari(TD.renk)}</p>`;

  return `<main class="td-dis"><div class="td">
<header class="td-ust"><h1 class="gizli">Tasarım Düzenle</h1>${bag('/panel', ikon('geri'), 'td-geri')}<div class="td-ust-dugmeler"><button class="td-ust-dugme" data-act="td-varsayilan">${ikon('varsayilan')}Varsayılana Dön</button><button class="td-ust-dugme" data-act="td-onizle">${ikon('goz')}Önizle</button><button class="td-ust-dugme kaydet">${ikon('tamam')}Kaydet</button></div></header>
<section class="td-onizleme" aria-label="Menü önizlemesi"><div class="td-kaydir">${tdOnizlemeSayfalari()}</div></section>

<div class="td-kartlar">
${bolum('renk', ikon('palet'), 'Renkler', 'Menünüzün renk kombinasyonunu seçin.', `<div class="td-secenekler">${t.duzen.renkler.map((p, i) => sec('palet', i, 'td-renk', `<span style="background:${p.k};--b:${p.v}"></span>`, p.ad)).join('')}</div>`, renkDetay)}
${bolum('yazilar', ikon('metin'), 'Yazılar', 'Menüdeki yazıları düzenleyin.', '', yaziDetay)}
${bolum('yazitipi', '<span class="yazi-ikon">Aa</span>', 'Yazı Tipi', 'Başlık ve ürün yazılarının görünümünü ayarlayın.', `<div class="td-secenekler">${TD_YAZILAR.map(([ad, f, ek], i) => sec('yazi', i, 'td-yazi', `<b style="font-family:${f};${ek}">Aa</b><small>${ad}</small>`)).join('')}</div>`)}
${bolum('logo', ikon('resim'), 'Logo ve Üst Görsel', 'Restoran logo ve üst görselini değiştirin.', `<div class="td-gorseller"><button class="td-logo" aria-label="Logoyu değiştir"><span>${ikon('catal')}</span><i class="td-kalem">${ikon('kalem')}</i></button><button class="td-kapak-kucuk" aria-label="Üst görseli değiştir"><i class="td-kalem">${ikon('kalem')}</i></button></div>`)}
${bolum('gorunum', ikon('izgara'), 'Menü Görünümü', 'Ürünlerin menüde nasıl görüneceğini seçin.', `<div class="td-secenekler">${TD_GORUNUMLER.map(([ad, ik, k], i) => sec('gorunum', i, 'td-gorunum', ikon(ik, k) + `<span>${ad}</span>`)).join('')}</div>`)}
</div>
</div></main>`;
}

function sayfaAlt(yol) {
  if (yol === '/tasarim-duzenle') return sayfaTasarimDuzenle();
  if (yol === '/tasarim-sec') return sayfaTasarimSec();
  document.title = SAYFALAR[yol] + ' — Menület';
  return `<main>${bag('/panel', '← Ana sayfa', 'geri')}<h1>${SAYFALAR[yol]}</h1></main>`;
}

// Kayıt sırasında işletme oluşturulamadıysa (bağlantı koptu vb.) buradan oluşturulur.
function sayfaIsletmeYok() {
  document.title = 'İşletme oluştur — Menület';
  return `<main><h1>İşletmenizi oluşturun</h1><p class="bilgi">Hesabınıza bağlı bir işletme bulunamadı.</p>
<form id="isletme-form" novalidate><label>İşletme adı<input name="isletme" required maxlength="80" autocomplete="organization"></label>
<p class="form-mesaj" role="status"></p><button class="ana-dugme">İşletmeyi oluştur</button></form></main>`;
}

function durumEkrani() {
  if (S.durum === 'hata') return '<main><p class="form-mesaj hata">Bilgileriniz yüklenemedi. İnternet bağlantınızı kontrol edin.</p><p><button class="ana-dugme" data-act="yeniden">Tekrar dene</button></p></main>';
  return '<main><p class="bilgi">Yükleniyor…</p></main>';
}

function isletmeYukle() {
  S.durum = 'yukleniyor';
  DB.isletmeler()
    .then((l) => { S.isletme = l[0] || null; S.durum = 'hazir'; })
    .catch((e) => { console.error('İşletme okunamadı', e); S.durum = 'hata'; })
    .finally(render);
}

// Kart ana sayfa görselinin sol sütunundaysa 'sol', sağ sütunundaysa 'sag'
function kartYonu(yol) { const k = KARTLAR.find((x) => x[0] === yol); return k && k[1] < PANO.G / 2 ? 'sol' : 'sag'; }

function render() {
  const yol = mevcutYol(), oncekiYol = sonYol, oncekiDar = app.classList.contains('dar');
  if (yol !== sonYol) { sonYol = yol; S.menuAcik = false; tsKapat(); TD.acik = null; TD.gecmis = false; }
  if (S.kullanici) { if (yol !== '/panel' && !SAYFALAR[yol]) return git('/panel', true); }
  else if (!GIRIS_SAYFALARI.includes(yol)) return git('/', true);

  let govde;
  if (!S.kullanici) govde = yol === '/kayit' ? sayfaKayit() : yol === '/sifre' ? sayfaSifre() : sayfaGiris();
  else {
    if (S.durum === 'bos') isletmeYukle();
    govde = S.durum !== 'hazir' ? durumEkrani() : !S.isletme ? sayfaIsletmeYok() : yol === '/panel' ? sayfaPanel() : sayfaAlt(yol);
  }
  const pano = S.kullanici && S.durum === 'hazir' && S.isletme && yol === '/panel';
  app.classList.toggle('tam', pano);
  // Kendi üst çubuğu olan sayfalar: bizim üst çubuk gösterilmez, sayfa telefon genişliğinde kalır
  const kendiUstu = S.kullanici && S.durum === 'hazir' && S.isletme && (yol === '/tasarim-duzenle' || yol === '/tasarim-sec');
  app.classList.toggle('dar', !!kendiUstu);
  const yon = gecisYonu; gecisYonu = null;
  document.querySelector('.alt-katman')?.remove();
  document.querySelector('.kapanan')?.remove();
  if (pano && SAYFALAR[oncekiYol]) {
    // Alt sayfadan ana sayfaya dönüş: kapanan sayfa geldiği yöne kayıp kaybolur, altından ana sayfa görünür.
    const kap = document.createElement('div'); kap.className = 'kapanan ' + kartYonu(oncekiYol);
    const ic = document.createElement('div'); ic.style.transform = `translateY(${-window.scrollY}px)`; if (oncekiDar) ic.className = 'dar';
    ic.append(...(app.querySelector('.gecis')?.childNodes || app.childNodes)); kap.append(ic); document.body.append(kap);
    kap.addEventListener('animationend', () => kap.remove(), { once: true });
  }
  if (yon && !pano) {
    // Ana sayfa yerinde kalır, yeni sayfa üstüne kayarak gelir; geçiş bitince kaldırılır.
    const alt = document.createElement('div'); alt.className = 'alt-katman';
    const ic = document.createElement('div'); ic.style.transform = `translateY(${-window.scrollY}px)`;
    ic.append(...app.childNodes); alt.append(ic); document.body.prepend(alt);
    app.classList.remove('tam');
    app.classList.toggle('dar', !!kendiUstu);
    app.innerHTML = `<div class="gecis ${yon}">${kendiUstu ? '' : ustBar()}${govde}</div>`;
    app.firstElementChild.addEventListener('animationend', () => alt.remove(), { once: true });
    if (kendiUstu && yol === '/tasarim-duzenle') tdKur();
    return;
  }
  app.innerHTML = (pano || kendiUstu ? '' : ustBar()) + govde;
  if (kendiUstu && yol === '/tasarim-duzenle') tdKur();
}

async function girisGonder(form) {
  const f = new FormData(form);
  formDurum(form, true);
  try { S.kullanici = await DB.auth.girisYap(f.get('email'), f.get('sifre')); S.durum = 'bos'; git('/panel'); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function kayitGonder(form) {
  const f = new FormData(form), ad = String(f.get('isletme') || '').trim();
  if (!ad) return formDurum(form, false, 'İşletme adını yazın.', 'hata');
  formDurum(form, true);
  try { S.kullanici = await DB.auth.kayitOl(ad, f.get('email'), f.get('sifre')); S.durum = 'bos'; git('/panel'); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function sifreGonder(form) {
  const f = new FormData(form);
  formDurum(form, true);
  try {
    await DB.auth.sifreSifirla(f.get('email'));
    formDurum(form, false, 'Bu e-posta adresiyle bir hesap varsa şifre sıfırlama bağlantısı gönderildi. Gelen kutunuzu ve istenmeyen (spam) klasörünü kontrol edin.', 'tamam');
  } catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

async function isletmeGonder(form) {
  const ad = String(new FormData(form).get('isletme') || '').trim();
  if (!ad) return formDurum(form, false, 'İşletme adını yazın.', 'hata');
  formDurum(form, true);
  try { await DB.isletmeOlustur(ad); S.durum = 'bos'; render(); }
  catch (e) { formDurum(form, false, hataMetni(e), 'hata'); }
}

document.addEventListener('submit', (e) => {
  const islem = { 'giris-form': girisGonder, 'kayit-form': kayitGonder, 'sifre-form': sifreGonder, 'isletme-form': isletmeGonder }[e.target.id];
  if (islem) { e.preventDefault(); islem(e.target); }
});

document.addEventListener('click', async (e) => {
  // Hesap menüsü açıkken dışarı tıklanırsa kapanır
  if (S.menuAcik && !e.target.closest('.hesap')) { S.menuAcik = false; render(); }
  const ln = e.target.closest('a[data-yol]');
  if (ln && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    if (ln.classList.contains('td-geri') && TD.acik) { tdDetayKapatIstek(); return; } // geri: önce detay kapanır
    if (!ln.classList.contains('kart')) { git(ln.dataset.yol); return; }
    // Ana sayfa kartı: gömülme ve sayfa açılması aynı anda başlar
    ln.classList.add('basili');
    gecisYonu = kartYonu(ln.dataset.yol); git(ln.dataset.yol);
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    case 'hesap-menu': if (GIRIS_ATLA) break; S.menuAcik = !S.menuAcik; render(); break;
    case 'cikis':
      await DB.auth.cikis();
      Object.assign(S, { kullanici: null, isletme: null, durum: 'bos', menuAcik: false });
      git('/');
      break;
    case 'yeniden': S.durum = 'bos'; render(); break;
    case 'ts-onizle': tsOnizle(el.dataset.no); break;
    case 'ts-sec': tsSec(el.dataset.no); break;
    case 'ts-modal-sec': tsSec(el.dataset.no); tsKapat(); break;
    case 'ts-kapat': if (!el.classList.contains('ts-modal') || e.target === el) tsKapat(); break;
    case 'ts-onayla': {
      const t = tsBul(TSD.secili);
      try { localStorage.setItem(TS_ANAHTAR, JSON.stringify({ no: t.no, ad: t.ad, kategori: t.kat })); } catch {}
      tsBildirim(`${t.no} · ${t.ad} seçildi`);
      break;
    }
    case 'td-nokta': {
      const k = document.querySelector('.td-kaydir');
      if (k) k.scrollTo({ left: k.clientWidth * +el.dataset.i, behavior: 'smooth' });
      break;
    }
    case 'td-varsayilan': tdVarsayilan(); break;
    case 'td-onizle': tdOnizle(); break;
    case 'td-detay':
      // Seçenek kutuları, detay içi ve logo/görsel düğmeleri hariç kartın her yeri detayı açar/kapatır
      if (!e.target.closest('.td-secenekler, .td-gorseller, .td-detay')) tdDetayAc(el.dataset.bolum);
      break;
    case 'td-sec': {
      if (el.dataset.grup === 'palet') {
        const p = tdTasarim().duzen.renkler[+el.dataset.i];
        TD.palet = +el.dataset.i; TD.renk = { k: p.k, z: p.z, y: p.y, v: p.v };
        tdRenkGuncelle();
        break;
      }
      // Tasarım Düzenle: seçeneği işaretle (sayfa yeniden çizilmez)
      TD[el.dataset.grup] = +el.dataset.i;
      if (el.dataset.grup === 'yazi') tdTumunuUygula();
      el.parentElement.querySelectorAll('.td-sec').forEach((b) => b.classList.toggle('secili', b === el));
      break;
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.ts-modal')) tsKapat();
  else if (S.menuAcik) { S.menuAcik = false; render(); }
});
// Tasarım Düzenle: renk kutuları ve yazı alanları değiştikçe önizleme anında güncellenir
document.addEventListener('input', (e) => {
  const d = e.target.dataset;
  if (d.tdAna !== undefined) { TD.renk = anaRenktenPalet(e.target.value); TD.palet = -1; tdRenkGuncelle(); }
  else if (d.tdRenk) { TD.renk[d.tdRenk] = e.target.value; TD.palet = -1; tdRenkGuncelle(); }
  else if (d.tdMetin) { TD.metin[d.tdMetin] = e.target.value; tdTumunuUygula(); }
});
// Tasarım Seç: kategori süzgeci. Seçili tasarım gizlenirse görünen ilk tasarım seçilir.
document.addEventListener('change', (e) => {
  if (e.target.id !== 'categorySelect') return;
  TSD.kat = e.target.value;
  const kartlar = [...document.querySelectorAll('.ts .design')];
  kartlar.forEach((c) => { c.style.display = TSD.kat === 'all' || tsBul(c.dataset.no).kat === TSD.kat ? '' : 'none'; });
  const secili = kartlar.find((c) => c.dataset.no === TSD.secili);
  if (secili && secili.style.display === 'none') { const ilk = kartlar.find((c) => c.style.display !== 'none'); if (ilk) tsSec(ilk.dataset.no); }
});
// Tasarım Düzenle önizleme şeridi kaydırıldıkça alttaki noktayı güncelle
document.addEventListener('scroll', (e) => {
  if (!e.target.classList?.contains('td-kaydir')) return;
  const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
  document.querySelectorAll('.td-noktalar button').forEach((b, j) => b.classList.toggle('aktif', j === i));
}, true);
window.addEventListener('popstate', () => {
  // Tasarım Düzenle'de detay açıkken geri: yalnızca detay kapanır
  if (TD.acik && TD.gecmis) { TD.gecmis = false; tdDetayKapat(); return; }
  render();
});
window.addEventListener('hashchange', render);

if (GIRIS_ATLA) Object.assign(S, { kullanici: { uid: 'deneme', email: '' }, isletme: { name: 'cabbar' }, durum: 'hazir' });
else S.kullanici = await DB.auth.hazir();
render();

// Uygulama olarak yüklenebilmesi için (yalnızca https'te çalışır)
if ('serviceWorker' in navigator && TEMIZ) navigator.serviceWorker.register(TABAN + 'sw.js').catch((e) => console.error('sw.js kaydedilemedi', e));
</script>
</body>
</html>
