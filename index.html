/* ===== Müşteri menüsü (koyu tema, işletme renkleriyle) ===== */
.m-sayfa body{background:var(--m-zemin)}
.karsilama-acik,.karsilama-acik body{overflow:hidden}
.m-tema{background:var(--m-zemin);color:var(--m-yazi);min-height:100vh;max-width:40rem;margin:0 auto;padding:0 1rem 2rem;position:relative}
.m-tema h1,.m-tema h2,.m-tema h3,.m-tema p{margin:0}
.m-ok{display:inline-block;width:0.55rem;height:0.55rem;border-right:0.15rem solid currentColor;border-top:0.15rem solid currentColor;transform:rotate(45deg);flex-shrink:0;opacity:.8}
.m-ok.sol{transform:rotate(-135deg)}
.m-ust{display:grid;grid-template-columns:2.5rem 1fr 2.5rem;align-items:center;padding:1rem 0 .5rem}
.m-marka{text-align:center}.m-marka img{max-height:3.25rem;max-width:100%;object-fit:contain;display:block}.m-logo{display:inline-block}.m-logo.acik{background:var(--m-yazi);border-radius:.8rem;padding:.35rem .9rem}.m-marka b{font:600 1.2rem Poppins,Manrope,sans-serif;letter-spacing:.02em}
.m-geri{width:2.5rem;height:2.5rem;border-radius:50%;border:.0625rem solid var(--m-cizgi);background:var(--m-kart);color:var(--m-yazi);display:grid;place-items:center;cursor:pointer}
.m-giris{padding:1.25rem 0 1rem}.m-giris h1{font:600 1.6rem Poppins,Manrope,sans-serif}.m-giris p{color:var(--m-soluk);margin-top:.35rem}
.m-tema .menu-tabs button{background:var(--m-kart);color:var(--m-yazi);border:.0625rem solid var(--m-cizgi)}
.m-tema .menu-tabs button.selected{background:var(--m-vurgu);color:#1a1410;border-color:var(--m-vurgu)}
.kat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:.75rem}

.kat-kart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82))}
.kat-yedek{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--b3),color-mix(in srgb,var(--b1) 45%,var(--b3)));color:var(--m-vurgu)}
.kat-ad{position:absolute;left:.7rem;right:.7rem;bottom:.7rem;z-index:1;display:flex;align-items:center;gap:.4rem;text-align:left}
.kat-ad b{flex:1;font-weight:600;font-size:.95rem}.kat-ad .ic{color:var(--m-vurgu)}
.m-kapak{position:relative;height:9rem;border-radius:1rem;overflow:hidden;background:linear-gradient(135deg,var(--b3),color-mix(in srgb,var(--b1) 50%,var(--b3)));display:flex;align-items:flex-end}
.m-kapak img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-kapak::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.75))}
.m-kapak h1{position:relative;z-index:1;padding:1rem;font:600 1.7rem Poppins,Manrope,sans-serif;color:#fff}
.m-sub{display:flex;gap:.6rem;overflow-x:auto;padding:1rem 0 .25rem;scrollbar-width:none}.m-sub::-webkit-scrollbar{display:none}
.m-sub button{flex:0 0 auto;width:4.8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;background:none;border:0;color:var(--m-yazi);font-size:.76rem;font-weight:500;line-height:1.2;cursor:pointer}
.m-sub button span{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--m-kart);border:.0625rem solid var(--m-cizgi);display:grid;place-items:center;overflow:hidden;color:var(--m-vurgu)}
.m-sub button span img{width:100%;height:100%;object-fit:cover}
.m-sub button.secili{color:var(--m-vurgu);font-weight:700}.m-sub button.secili span{border:.125rem solid var(--m-vurgu);box-shadow:0 0 .9rem color-mix(in srgb,var(--m-vurgu) 35%,transparent)}
.m-ara{display:flex;align-items:center;gap:.6rem;margin:1rem 0 .5rem;padding:.75rem 1rem;border-radius:2rem;background:var(--m-kart);border:.0625rem solid var(--m-cizgi);color:var(--m-soluk)}
.m-ara input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--m-yazi)}.m-ara button{background:none;border:0;color:inherit;cursor:pointer}
.u-baslik{display:flex;justify-content:space-between;align-items:baseline;padding:.9rem 0 .4rem}.u-baslik h2{font:600 1.15rem Poppins,Manrope,sans-serif}.u-baslik span{color:var(--m-soluk);font-size:.8rem}
.u-satir{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:none;border:0;border-bottom:.0625rem solid var(--m-cizgi);padding:.85rem 0;color:var(--m-yazi);cursor:pointer}
.u-satir>img,.u-yedek{width:5.5rem;height:4.6rem;border-radius:.7rem;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--b3),var(--m-kart))}
.u-satir>div{flex:1;min-width:0}.u-satir h3{font-size:1rem;overflow-wrap:anywhere}

.m-tema .product-detail>b{color:var(--m-vurgu);font-size:1.25rem}.m-tema .product-detail>button{background:var(--m-zemin);color:var(--m-yazi);border:.0625rem solid var(--m-cizgi)}
/* karşılama ekranı */
.karsilama{position:fixed;inset:0;z-index:100;overflow:hidden;display:grid;place-items:center;cursor:pointer;color:#fff;background:var(--b3);background:linear-gradient(160deg,var(--b3),color-mix(in srgb,var(--b1) 50%,var(--b3)) 55%,var(--b3));transition:opacity .45s ease,transform .45s ease;outline:0}
.karsilama.kapaniyor{opacity:0;transform:scale(1.04);pointer-events:none}
.k-isik{position:absolute;border-radius:50%;filter:blur(3.5rem);opacity:.6;animation:k-yuz 14s ease-in-out infinite alternate}
.k-i1{width:70vw;height:70vw;left:-20vw;top:-10vh;background:var(--b1)}
.k-i2{width:60vw;height:60vw;right:-15vw;bottom:-5vh;background:var(--b2);animation-delay:-5s}
.k-i3{width:40vw;height:40vw;left:30vw;top:40vh;background:color-mix(in srgb,var(--b1) 60%,#fff);opacity:.25;animation-delay:-9s}
.k-kapak,.k-buyuk{position:absolute;max-width:none;object-fit:cover}
.k-kapak{inset:0;width:100%;height:100%;opacity:1;filter:blur(.15rem) brightness(.75) saturate(1.1);transform:scale(1.04);animation:k-zoom 30s ease-in-out infinite}
@keyframes k-zoom{50%{transform:scale(1.2)}}
.karsilama.kapakli .k-isik{opacity:.2}.karsilama.kapakli .k-vinyet{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 40%,rgba(0,0,0,.65))}
.k-buyuk{width:150%;left:-25%;top:50%;transform:translateY(-50%);object-fit:contain;opacity:.08;filter:blur(1.5rem)}
.k-vinyet{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.5))}
.k-icerik{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:1.5rem;text-align:center;max-width:100%}
.k-kart{width:min(40vw,9rem);aspect-ratio:1;display:grid;place-items:center;padding:1rem;border-radius:1.5rem;backdrop-filter:blur(1rem);-webkit-backdrop-filter:blur(1rem);border:.0625rem solid rgba(255,255,255,.25);box-shadow:0 1.5rem 3rem rgba(0,0,0,.35)}
.k-kart.ton-acik{background:rgba(255,255,255,.1)}.k-kart.ton-koyu{background:rgba(255,255,255,.9)}
.k-kart img{max-width:100%;max-height:100%;object-fit:contain}
.k-kart .ic{color:#fff;opacity:.85}.k-kart.ton-koyu .ic{color:var(--b3)}
.karsilama h1{font:500 clamp(2.1rem,10vw,3.1rem)/1.15 'Playfair Display',Georgia,serif;letter-spacing:0;margin:1.7rem 0 0;color:color-mix(in srgb,var(--b1) 45%,#fff);text-shadow:0 .125rem 1rem rgba(0,0,0,.4)}
.karsilama p{margin:0;font:300 1rem Poppins,Manrope,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.85);animation:k-nabiz 2.4s ease-in-out infinite}
@keyframes k-yuz{to{transform:translate(8vw,6vh) scale(1.15)}}
@keyframes k-nabiz{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.k-isik,.karsilama p,.k-kapak{animation:none}}

/* =====================================================================
   MENÜLET — tek dosya sürüm
   Sayfalar: / (tanıtım) · /giris · /kayit · /panel · /menu/<adres>  (eski #/... adresleri otomatik temiz adrese çevrilir)
   ===================================================================== */

/* =====================================================================
   VERİ KATMANI (DB)
   ---------------------------------------------------------------------
   Veriler Firebase'de tutulur (Authentication + Firestore + Storage). Arayüz kodu
   Firebase'e doğrudan dokunmaz, yalnızca DB.* fonksiyonlarını çağırır.

   Fonksiyonların Firebase karşılıkları:
     DB.auth.hazir()   -> onAuthStateChanged ile ilk oturum bilgisini bekler, users/{uid} okur
     DB.auth.signup()  -> createUserWithEmailAndPassword + users/{uid} { name (e-postanın @ öncesi), email, role:'member' }
     DB.auth.login()   -> signInWithEmailAndPassword (+ users/{uid} dokümanından role okunur)
     DB.auth.reset()   -> sendPasswordResetEmail
     DB.auth.logout()  -> signOut
     DB.loadPanel()    -> businesses (owner == uid), sonra her işletme için menus/categories/products
     DB.publicMenu()   -> businesses where slug == x && published == true, sonra bağlı kayıtlar (tek seferlik, 'Menüyü yenile' için)
     DB.watchMenu()    -> aynı sorgular onSnapshot ile canlı izlenir; müşteri ekranı kendiliğinden güncellenir
     DB.create/update/remove -> addDoc / updateDoc / deleteDoc (işletmelerde slugs/{adres} ile birlikte tek işlemde)
     DB.uploadPhoto()  -> Fotoğrafı tarayıcıda WebP'ye çevirip küçültür (ürün ~250 KB, kapak ~350 KB),
                          Storage'a users/{uid}/ klasörüne yükler ve indirme adresini döndürür.
     DB.uploadLogo()   -> Logoyu PNG'ye çevirip (~200 KB) Storage'a yükler; { logo: adres, tone } döndürür.
     Dosya temizliği   -> update/remove sırasında değişen ya da silinen photo/image/logo/cover dosyası,
                          başka hiçbir kayıt kullanmıyorsa Storage'dan da silinir (dosyaTemizle).

   Koleksiyonlar ve alanlar:
     users             { name, email, role: 'member' | 'admin', created, updated }
     businesses        { owner, name, slug (benzersiz, a-z0-9-), description, address, phone, published, plan }
     slugs             { business, owner }   (belge adı = paylaşım adresi; adresin benzersizliğini sağlar)
     menus             { business, name }
     categories        { business, menu, name, kind: 'Ana kategori' | 'Alt kategori', parent, image }
     products          { business, menu, category, name, description, price, allergens, image, photo }
     image_library     { name, image, photo, source }   (yalnızca yönetici ekler)
     platform_settings { name, value }                  (yalnızca yönetici)

   Güvenlik kuralları Firebase Konsolu > Firestore > Rules (menulet-firestore.rules) ve
   Storage > Rules (menulet-storage.rules) bölümlerine yapıştırılır. Yönetici yapmak için Konsol'da users/{uid}
   belgesinde role alanını 'admin' yapın.
   ===================================================================== */

// --- Firebase bağlantısı ---
const FB_TEMEL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const firebaseConfig = {
  apiKey: 'AIzaSyD9axc9mKz0VXOXL9z3ovcNRiYP28nh1bY',
  authDomain: 'menulet-3edcd.firebaseapp.com',
  projectId: 'menulet-3edcd',
  storageBucket: 'menulet-3edcd.firebasestorage.app',
  messagingSenderId: '742666635212',
  appId: '1:742666635212:web:4bf17528936bcfacd2bf69',
};
// Site GitHub Pages'te alt klasörde yayınlanır (kullanici.github.io/menulet/). TABAN o klasördür.
// Kendi alan adı bağlanırsa ya da yerelde açılırsa kök ('/') kullanılır.
const TABAN = (() => {
  if (!location.hostname.endsWith('.github.io')) return '/';
  const ilk = location.pathname.split('/')[1];
  return ilk ? '/' + ilk + '/' : '/';
})();
let FB = null; // yüklenemezse (internet yok) site açılır ama giriş çalışmaz
// Önce Google'ın sunucusu, olmazsa sitenin kendi kopyası (depoya fb klasörü eklenirse) denenir.
const YEREL_FB = location.protocol === 'file:' ? './fb/' : TABAN + 'fb/';
const FB_DOSYALAR = ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js', 'firebase-storage.js'];
for (const temel of [FB_TEMEL, YEREL_FB]) {
  try {
    const [uygulama, kimlik, veritabani, depo] = await Promise.all(FB_DOSYALAR.map((d) => import(temel + d)));
    const fbApp = uygulama.initializeApp(firebaseConfig);
    FB = { au: kimlik, fs: veritabani, st: depo, auth: kimlik.getAuth(fbApp), db: veritabani.getFirestore(fbApp), storage: depo.getStorage(fbApp) };
    break;
  } catch (e) { console.error('Firebase yüklenemedi:', temel, e); }
}

// Tanıtım sayfasındaki örnek telefon görseli
const ORNEK_GORSEL = 'https://images.hostinger.com/f12097c1-184d-46af-9d70-2368f8703fd4/f8182058-da8f-4ebc-9b85-f1ad6423bd7c.png';

const DB = (() => {
  function simdi() { return new Date().toISOString(); }
  function hata(code, message) { const e = new Error(message || code); e.code = code; return e; }
  function fb() { if (!FB) throw hata('auth/network-request-failed'); return FB; }

  let aktif = null; // { id, name, email, role }
  const admin = () => aktif?.role === 'admin';
  const sirali = (l) => [...l].sort((a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || String(a.created).localeCompare(String(b.created)));
  const SLUG = /^[a-z0-9-]+$/;

  async function profilOku(user) {
    const { fs, db } = fb();
    const yedek = { name: (user.email || '').split('@')[0], email: user.email || '', role: 'member' };
    try {
      const ref = fs.doc(db, 'users', user.uid);
      const snap = await fs.getDoc(ref);
      if (snap.exists()) { const p = snap.data(); return { id: user.uid, name: p.name || yedek.name, email: p.email || yedek.email, role: p.role || 'member' }; }
      await fs.setDoc(ref, { ...yedek, created: simdi(), updated: simdi() });
    } catch (e) { console.error('Profil okunamadı', e); }
    return { id: user.uid, ...yedek };
  }

  const topla = async (q) => (await FB.fs.getDocs(q)).docs.map((d) => ({ ...d.data(), id: d.id }));
  const kol = (k) => FB.fs.collection(FB.db, k);

  // --- Storage yardımcıları ---
  const DOSYA_ALANLARI = ['photo', 'image', 'logo', 'cover'];
  const KULLANAN = { products: ['photo', 'image'], categories: ['photo', 'image'], image_library: ['photo', 'image'], businesses: ['logo', 'cover'] };
  const bizimDosya = (url) => typeof url === 'string' && url.startsWith('https://firebasestorage.googleapis.com/') && url.includes('/b/' + firebaseConfig.storageBucket + '/');

  async function dosyaYukle(blob, uzanti) {
    const { st, storage } = fb();
    if (!aktif) throw hata('permission-denied');
    const ad = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.' + uzanti;
    const ref = st.ref(storage, `users/${aktif.id}/${ad}`);
    await st.uploadBytes(ref, blob, { contentType: blob.type, cacheControl: 'public, max-age=31536000' });
    return st.getDownloadURL(ref);
  }

  // Dosyayı başka bir kayıt hâlâ kullanıyor mu? Emin olunamazsa "kullanılıyor" sayılır (silinmez).
  async function kullaniliyor(url) {
    const { fs } = fb();
    try {
      const bids = admin() ? null : (await topla(fs.query(kol('businesses'), fs.where('owner', '==', aktif.id)))).map((b) => b.id);
      for (const [k, alanlar] of Object.entries(KULLANAN)) for (const a of alanlar) {
        let sorgular;
        if (admin()) sorgular = [fs.query(kol(k), fs.where(a, '==', url), fs.limit(1))];
        else if (k === 'businesses') sorgular = [fs.query(kol(k), fs.where('owner', '==', aktif.id), fs.where(a, '==', url), fs.limit(1))];
        else sorgular = [...bids, ...(k === 'image_library' ? [''] : [])].map((id) => fs.query(kol(k), fs.where('business', '==', id), fs.where(a, '==', url), fs.limit(1)));
        for (const q of sorgular) if ((await fs.getDocs(q)).size) return true;
      }
      return false;
    } catch (e) { console.error('Dosya kullanımı denetlenemedi', e); return true; }
  }

  // Artık hiçbir kayıtta geçmeyen dosyaları Storage'dan siler. Hata olursa sessizce geçer.
  async function dosyaTemizle(urller) {
    if (!FB) return;
    for (const url of [...new Set(urller)].filter(bizimDosya)) {
      try { if (!(await kullaniliyor(url))) await FB.st.deleteObject(FB.st.ref(FB.storage, url)); }
      catch (e) { if (e?.code !== 'storage/object-not-found') console.error('Dosya silinemedi', e); }
    }
  }

  // Silinmek istenen kayda bağlı başka kayıt var mı (zorunlu ilişkiler)
  const BAGLAR = {
    businesses: [['menus', 'business'], ['categories', 'business'], ['products', 'business']],
    menus: [['categories', 'menu']],
    categories: [['products', 'category'], ['categories', 'parent']],
  };

  async function slugKontrol(slug, businessId) {
    const { fs, db } = fb();
    if (!SLUG.test(String(slug || ''))) throw hata('invalid-slug');
    const s = await fs.getDoc(fs.doc(db, 'slugs', slug));
    if (s.exists() && s.data().business !== businessId) throw hata('slug-taken');
  }

  return {
    auth: {
      async hazir() {
        if (!FB) return null;
        const user = await new Promise((ok) => { const kapat = FB.au.onAuthStateChanged(FB.auth, (u) => { kapat(); ok(u); }); });
        aktif = user ? await profilOku(user) : null;
        return aktif;
      },
      current: () => aktif,
      async signup(email, password) {
        const { au, fs, auth, db } = fb();
        const cred = await au.createUserWithEmailAndPassword(auth, String(email).trim(), String(password));
        const eposta = cred.user.email || String(email).trim();
        const p = { name: eposta.split('@')[0], email: eposta, role: 'member', created: simdi(), updated: simdi() };
        try { await fs.setDoc(fs.doc(db, 'users', cred.user.uid), p); } catch (e) { console.error('Profil yazılamadı', e); }
        aktif = { id: cred.user.uid, name: p.name, email: p.email, role: 'member' };
        return aktif;
      },
      async login(email, password) {
        const { au, auth } = fb();
        const cred = await au.signInWithEmailAndPassword(auth, String(email).trim(), String(password));
        aktif = await profilOku(cred.user);
        return aktif;
      },
      async reset(email) {
        const { au, auth } = fb();
        try { await au.sendPasswordResetEmail(auth, String(email).trim()); }
        catch (e) { if (e.code !== 'auth/user-not-found') throw e; } // hesap var/yok bilgisini sızdırma
        return true;
      },
      async logout() { if (FB) await FB.au.signOut(FB.auth); aktif = null; },
    },

    async loadPanel() {
      const u = aktif;
      if (!u) throw hata('permission-denied');
      const { fs } = fb();
      const businesses = sirali(await topla(admin() ? kol('businesses') : fs.query(kol('businesses'), fs.where('owner', '==', u.id))));
      const ait = async (k) => {
        if (admin()) return sirali(await topla(kol(k)));
        const parcalar = await Promise.all(businesses.map((b) => topla(fs.query(kol(k), fs.where('business', '==', b.id)))));
        return sirali(parcalar.flat());
      };
      const kutup = async () => (admin() ? topla(kol('image_library')) : (await Promise.all(['', ...businesses.map((b) => b.id)].map((id) => topla(fs.query(kol('image_library'), fs.where('business', '==', id)))))).flat());
      const [menus, categories, products, image_library, platform_settings] = await Promise.all([
        ait('menus'), ait('categories'), ait('products'),
        kutup(),
        admin() ? topla(kol('platform_settings')) : Promise.resolve([]),
      ]);
      return { businesses, menus, categories, products, image_library: sirali(image_library), platform_settings: sirali(platform_settings) };
    },

    async publicMenu(slug) {
      const { fs } = fb();
      const bl = await topla(fs.query(kol('businesses'), fs.where('slug', '==', slug), fs.where('published', '==', true), fs.limit(1)));
      const b = bl[0];
      if (!b) return null;
      const ait = async (k) => sirali(await topla(fs.query(kol(k), fs.where('business', '==', b.id))));
      const [menus, categories, products] = await Promise.all([ait('menus'), ait('categories'), ait('products')]);
      return { business: b, menus, categories, products };
    },

    // Müşteri menüsünü canlı izler: panelde yapılan her değişiklik açık olan ekrana kendiliğinden yansır.
    // cb(veri) veri değişince, cb(null) menü yoksa/yayında değilse, cb(null, hata) okunamazsa çağrılır. Döner: izlemeyi durduran fonksiyon.
    watchMenu(slug, cb) {
      const { fs } = fb();
      const durum = { b: undefined, menus: undefined, categories: undefined, products: undefined }, kapat = [];
      let bid = '';
      const yay = () => {
        if (durum.b === undefined) return;
        if (durum.b === null) return cb(null);
        if (['menus', 'categories', 'products'].some((k) => durum[k] === undefined)) return;
        cb({ business: durum.b, menus: durum.menus, categories: durum.categories, products: durum.products });
      };
      const hata = (e) => { if (durum.b !== null) cb(null, e); };
      const alt = (id) => ['menus', 'categories', 'products'].forEach((k) => kapat.push(fs.onSnapshot(fs.query(kol(k), fs.where('business', '==', id)), (sn) => { durum[k] = sirali(sn.docs.map((d) => ({ ...d.data(), id: d.id }))); yay(); }, hata)));
      kapat.push(fs.onSnapshot(fs.query(kol('businesses'), fs.where('slug', '==', slug), fs.where('published', '==', true), fs.limit(1)), (sn) => {
        const d = sn.docs[0];
        if (!d) { durum.b = null; yay(); return; }
        if (bid !== d.id) { bid = d.id; alt(d.id); }
        durum.b = { ...d.data(), id: d.id }; yay();
      }, hata));

    },

    async create(col, veri) {

      if (!aktif) throw hata('permission-denied');
      if (col === 'businesses') {
        if (veri.owner !== aktif.id) throw hata('permission-denied');
        const ref = fs.doc(kol('businesses'));
        await slugKontrol(veri.slug, ref.id);
        const kayit = { ...veri, created: simdi(), updated: simdi() };
        const batch = fs.writeBatch(db);
        batch.set(fs.doc(db, 'slugs', veri.slug), { business: ref.id, owner: veri.owner });
        batch.set(ref, kayit);
        try { await batch.commit(); }
        catch (e) { await slugKontrol(veri.slug, ref.id); throw e; }
        return { ...kayit, id: ref.id };
      }
      const kayit = { ...veri, created: simdi(), updated: simdi() };

      const { fs, db } = fb();

      const ref = fs.doc(db, col, id);
      const eski = await fs.getDoc(ref);
      if (!eski.exists()) throw hata('not-found');
      const e = eski.data();
      if ('owner' in veri && veri.owner !== e.owner) throw hata('permission-denied');
      if ('business' in veri && col !== 'businesses' && veri.business !== e.business) throw hata('permission-denied');
      const yeni = { ...veri, updated: simdi() };
      if (col === 'businesses' && veri.slug && veri.slug !== e.slug) {

        const sorgu = col === 'businesses'

    // Logoyu doğrular (dosya imzası), PNG'ye çevirir (şeffaflık korunur, oran bozulmaz), ~200 KB altına küçültür, Storage'a yükler.
    // Döner: { logo: indirme adresi, tone: 'dark' | 'light' (logonun açık/koyu olması) }
    async uploadLogo(file) {
      const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
      const ok = (...a) => a.every((x, i) => b[i] === x);
      const gecerli = ok(0x89, 0x50, 0x4e, 0x47) || ok(0xff, 0xd8, 0xff) || (ok(0x52, 0x49, 0x46, 0x46) && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50);
      if (!gecerli) throw hata('logo-gecersiz');
      let kaynak;
      try { kaynak = await createImageBitmap(file); } catch { throw hata('logo-gecersiz'); }
      let olcek = Math.min(1, 800 / Math.max(kaynak.width, kaynak.height));
      for (let t = 0; t < 10; t++) {
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(kaynak.width * olcek)); c.height = Math.max(1, Math.round(kaynak.height * olcek));
        const g = c.getContext('2d'); g.drawImage(kaynak, 0, 0, c.width, c.height);
        const blob = await new Promise((y) => c.toBlob(y, 'image/png'));
        if (blob && blob.size <= 200 * 1024) {
          const px = g.getImageData(0, 0, c.width, c.height).data; let top = 0, n = 0;
          for (let i = 0; i < px.length; i += 16) if (px[i + 3] > 128) { top += (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255; n++; }
          if (kaynak.close) kaynak.close();
          const logo = await dosyaYukle(blob, 'png');
          return { logo, tone: n && top / n > 0.5 ? 'light' : 'dark' };
        }
        olcek *= 0.8;
      }
      throw hata('logo-buyuk');
    },

    // Fotoğrafı tarayıcıda küçültüp WebP'ye çevirir (varsayılan ~250 KB altı), Storage'a yükler, indirme adresini döndürür.
    // Dosya boyutu sınırı yoktur; cihazın okuyamadığı dosyalarda 'foto-okunamadi' hatası verir.
    async uploadPhoto(file, kb = 250, kenarSnr = 1600) {
      const HEDEF = kb * 1024;
      let kaynak = null;
      try { kaynak = await createImageBitmap(file); }
      catch {
        kaynak = await new Promise((ok, no) => {
          const url = URL.createObjectURL(file); const i = new Image();
          i.onload = () => { URL.revokeObjectURL(url); ok(i); };
          i.onerror = () => { URL.revokeObjectURL(url); no(); };
          i.src = url;
        }).catch(() => null);
      }
      if (!kaynak || !(kaynak.width > 0)) throw hata('foto-okunamadi');
      const deneme = document.createElement('canvas');
      const webp = deneme.toDataURL('image/webp').startsWith('data:image/webp');
      const tip = webp ? 'image/webp' : 'image/jpeg'; // eski tarayıcılarda JPEG'e düşer
      let olcek = Math.min(1, kenarSnr / Math.max(kaynak.width, kaynak.height));
      let blob = null;
      for (let tur = 0; tur < 8; tur++) {
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(kaynak.width * olcek));
        c.height = Math.max(1, Math.round(kaynak.height * olcek));
        const g = c.getContext('2d');
        if (!webp) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(kaynak, 0, 0, c.width, c.height);
        for (const kalite of [0.85, 0.75, 0.65, 0.55, 0.45, 0.35]) {
          blob = await new Promise((ok) => c.toBlob(ok, tip, kalite));
          if (!blob) throw hata('foto-okunamadi');
          if (blob.size <= HEDEF) break;
        }
        if (blob.size <= HEDEF) break;
        olcek *= 0.8;
      }
      if (kaynak.close) kaynak.close();
      return dosyaYukle(blob, webp ? 'webp' : 'jpg');
    },
  };
})();

function hataMetni(err, mode) {
  const c = err?.code || '';
  if (c === 'auth/network-request-failed') return 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.';
  if (c === 'auth/too-many-requests') return 'Çok fazla deneme yapıldı. Lütfen birkaç dakika sonra tekrar deneyin.';
  if (c === 'auth/email-already-in-use') return 'Bu e-posta adresi zaten kayıtlı veya geçersiz.';
  if (c === 'auth/invalid-email') return mode === 'signup' ? 'Bu e-posta adresi zaten kayıtlı veya geçersiz.' : 'Geçerli bir e-posta adresi girin.';
  if (c === 'auth/weak-password') return 'Şifre en az 8 karakter olmalıdır.';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(c)) return 'E-posta veya şifre hatalı. Lütfen bilgilerinizi kontrol edin.';
  if (c === 'auth/operation-not-allowed') return 'E-posta/şifre girişi henüz etkinleştirilmemiş.';
  if (c === 'auth/user-disabled') return 'Bu hesap devre dışı bırakılmış.';
  return 'Beklenmeyen bir sorun oluştu. Tekrar deneyin.';
}

const hexOk = (v) => /^#[0-9a-f]{6}$/i.test(v || '');
const hex2 = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, '0');
function hslHex(h, sa, l) {

function rgbHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;

  return [h * 60, sa, l];
}

async function logodanRenkler(dosya) {
  const bmp = await createImageBitmap(dosya), k = Math.min(1, 64 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, c.width, c.height);
  const px = g.getImageData(0, 0, c.width, c.height).data, kova = {};

    if (px[i + 3] < 128) continue;
    const [h, sa, l] = rgbHsl(px[i], px[i + 1], px[i + 2]);
    if (l > 0.93 || l < 0.07 || sa < 0.15) continue;
    const key = Math.floor(h / 30), w = 0.3 + sa, o = kova[key] || (kova[key] = { n: 0, h: 0, s: 0, l: 0 });
    o.n += w; o.h += h * w; o.s += sa * w; o.l += l * w;
  }
  const liste = Object.values(kova).sort((a, b) => b.n - a.n).map((o) => [o.h / o.n, o.s / o.n, o.l / o.n]);
  if (!liste.length) return null;
  const [h1, s1, l1] = liste[0];
  const c2 = liste[1] && Math.abs(liste[1][0] - h1) > 20 ? liste[1] : [(h1 + 25) % 360, s1, Math.min(l1 + 0.12, 0.7)];
  return [hslHex(h1, s1, l1), hslHex(c2[0], c2[1], c2[2]), hslHex(h1, Math.min(s1, 0.5), 0.09)];
}

async function kayitGonder(form) {
  if (P.busy) return;
  const tab = P.tab, edit = P.edit;
  const fd = new FormData(form);
  const veri = {};
  for (const [k, v] of fd.entries()) if (!(v instanceof File)) veri[k] = String(v);
  delete veri.hazir;
  const yonetici = kullanici?.role === 'admin';
  P.onizleme = {};
  const dur = (mesaj) => { P.taslak = { ...veri, ...P.onizleme }; P.message = mesaj; P.busy = false; render(); };

  if (tab === 'businesses') {
    veri.published = !!fd.get('published');
    veri.welcome = !!fd.get('welcome');
    delete veri.logo_kaldir; delete veri.cover_kaldir;
    for (const n of [1, 2, 3]) if (!hexOk(veri['brand' + n])) delete veri['brand' + n];
    if (!edit) {
      if (!kullanici) return dur('İşletme oluşturmak için önce giriş yapmalısınız.');
      veri.owner = kullanici.id;
    }
  } else if (tab === 'image_library') {
    if (!edit) { if (!yonetici && !P.business) return dur('Önce bir işletme seçin.'); veri.business = yonetici ? '' : P.business; }
  } else if (!GENEL.includes(tab)) veri.business = P.business;

  if (tab === 'categories') {
    const ad = (veri.name || '').trim();
    if (!ad) return dur('Lütfen bir kategori adı yazın.');
    if (!veri.menu) return dur('Önce bu işletme için bir menü oluşturmalısınız.');
    const ayni = P.data.categories.some((c) => (!edit || c.id !== edit.id) && c.business === P.business && c.menu === veri.menu && tr(c.name) === tr(ad));
    if (ayni) return dur('Bu menüde aynı isimli bir kategori zaten var.');
    veri.name = ad;
    if (veri.kind === 'Alt kategori') {
      if (!veri.parent) return dur('Alt kategori için bir üst kategori seçin.');
      if (!veri.icon) return dur('İkon seçmediniz. Alt kategori için uygun bir ikon seçin.');
      veri.image = ''; veri.photo = '';
    } else { veri.parent = ''; veri.icon = ''; }
  }
  if (tab === 'products') {
    veri.price = Number(veri.price || 0);
    if (veri.price === 0 && !confirm('Bu ürünün fiyatı 0 ₺ olarak girildi. Yine de kaydetmek istiyor musunuz?')) return dur('Fiyatı kontrol edip tekrar kaydedin.');
  }

  for (const n of ['logo', 'cover', 'photo']) { const f = fd.get(n); if (f instanceof File && f.size) P.onizleme[n] = URL.createObjectURL(f); else if (fd.get(n + '_kaldir')) P.onizleme[n] = ''; }
  P.taslak = { ...veri, ...P.onizleme }; P.busy = true; P.message = ''; render();
  const yeniDosyalar = [];
  try {
    const foto = fd.get('photo');
    if (foto instanceof File && foto.size && !(tab === 'categories' && veri.kind === 'Alt kategori')) {
      veri.photo = await DB.uploadPhoto(foto);
      yeniDosyalar.push(veri.photo);
    }
    if (tab === 'businesses') {
      const lg = fd.get('logo'), cv = fd.get('cover');
      if (lg instanceof File && lg.size) { const sn = await DB.uploadLogo(lg); veri.logo = sn.logo; veri.logoTone = sn.tone; yeniDosyalar.push(sn.logo); }
      else if (fd.get('logo_kaldir')) { veri.logo = ''; veri.logoTone = ''; }
      if (cv instanceof File && cv.size) { veri.cover = await DB.uploadPhoto(cv, 350, 2000); yeniDosyalar.push(veri.cover); }
      else if (fd.get('cover_kaldir')) veri.cover = '';
    }
    const kayit = edit ? await DB.update(tab, edit.id, veri) : await DB.create(tab, veri);
    if (veri.photo && ['products', 'categories'].includes(tab)) await DB.create('image_library', { name: veri.name, image: veri.photo, source: 'yükleme', business: yonetici ? '' : P.business }).catch(() => {});
    if (tab === 'businesses') C.slug = null; // müşteri menüsü yeni renk/logo ile tazelensin
    await panelYukle();
    if (tab === 'businesses') P.business = kayit.id;
    P.edit = undefined;
    dur('Kayıt başarıyla kaydedildi.');
    P.taslak = null;
  } catch (err) {
    console.error('Kayıt hatası', err);
    DB.dosyalariGeriAl(yeniDosyalar);
    dur(err.code === 'slug-taken' ? 'Bu paylaşım adresi başka bir işletme tarafından kullanılıyor.'
      : err.code === 'foto-okunamadi' ? 'Bu fotoğraf okunamadı. Başka bir fotoğraf deneyin.'
      : err.code === 'logo-gecersiz' ? 'Logo olarak yalnızca PNG, JPG veya WEBP görsel yükleyebilirsiniz.'
      : err.code === 'logo-buyuk' ? 'Logo yeterince küçültülemedi. Daha sade bir logo deneyin.'
      : err.code === 'invalid-slug' ? 'Paylaşım adresi yalnızca küçük harf, rakam ve tire içerebilir.'
      : String(err.code || '').startsWith('storage/') ? `Görsel yüklenemedi (${err.code}). İnternet bağlantınızı ve Storage kurallarını kontrol edin.`
      : 'Kaydedilemedi. Zorunlu alanları, menü bağlantısını ve erişim izinlerini kontrol edin.');
  }
}

async function kayitSil(id) {
  const tab = P.tab, d = P.data;
  if (tab === 'categories') {
    if (d.products.some((p) => p.category === id)) { P.message = 'Bu kategoride ürünler var. Önce ürünleri başka kategoriye taşıyın veya silin.'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (d.categories.some((c) => c.parent === id)) { P.message = 'Bu kategoriye bağlı alt kategoriler var. Önce alt kategorileri kaldırın.'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  }
  if (!confirm('Bu kayıt silinsin mi? Bu işlem geri alınamayabilir.')) return;
  try {
    await DB.remove(tab, id);
    await panelYukle();
    if (tab === 'businesses' && P.business === id) P.business = P.data.businesses[0]?.id || '';
    P.message = 'Kayıt silindi.';
  } catch { P.message = 'Silinemedi. Kayıt ilişkilerini ve erişim izinlerini kontrol edin.'; }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// QR kodu PNG olarak üretir (qrcode-generator kütüphanesi aşağıda gömülü)
function qrPng(metin, hedef = 600) {
  const q = qrcode(0, 'M');
  q.addData(unescape(encodeURIComponent(metin)));
  q.make();
  const n = q.getModuleCount(), kenar = 4, hucre = Math.ceil(hedef / (n + kenar * 2));
  const c = document.createElement('canvas');
  c.width = c.height = hucre * (n + kenar * 2);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + kenar) * hucre, (r + kenar) * hucre, hucre, hucre);
  return c.toDataURL('image/png');
}

const C = { unsub: null, slug: null, gecildi: false, hata: '', veri: undefined, menu: '', main: '', sub: '', detail: null, query: '' };

function sayfaMenu(slug) {
  if (C.slug !== slug) {
    if (C.unsub) C.unsub();
    Object.assign(C, { slug, gecildi: false, hata: '', veri: undefined, menu: '', main: '', sub: '', detail: null, query: '' });
    C.unsub = DB.watchMenu(slug, (v, err) => {
      if (err && !v) { console.error('Menü okunamadı', err); if (C.veri) return; C.veri = null; C.hata = err?.code || String(err?.message || err); render(); return; }
      C.veri = v;
      if (v) {
        const var_ = (id) => v.categories.some((c) => c.id === id);
        if (!v.menus.some((m) => m.id === C.menu)) C.menu = v.menus[0]?.id || '';
        if (C.main && !var_(C.main)) { C.main = ''; C.sub = ''; }
        if (C.sub && !var_(C.sub)) C.sub = '';
        if (C.detail) C.detail = v.products.find((x) => x.id === C.detail.id) || null;
      }
      if (document.activeElement?.id === 'menu-ara' && v) { document.getElementById('menu-govde').innerHTML = menuGovde(); return; }
      render();
    });
  }
  if (C.veri === undefined) return '<main class="customer m-tema" aria-busy="true"></main>';
  if (C.veri === null && C.hata) {
    document.title = 'Menü yüklenemedi — Menület';
    return `<main class="customer"><div class="customer-head"><span>DİJİTAL MENÜ</span><h1>Menü yüklenemedi</h1><p>Bağlantı ya da erişim sorunu oluştu. Sayfayı yenileyip tekrar deneyin.</p><small>Hata kodu: ${esc(C.hata)}</small></div></main>`;
  }
  if (C.veri === null) {
    document.title = 'Menü bulunamadı — Menület';
    return '<main class="customer"><div class="customer-head"><span>DİJİTAL MENÜ</span><h1>Menü bulunamadı</h1><p>Menü bulunamadı veya henüz yayınlanmadı.</p></div></main>';
  }
  const b = C.veri.business;
  document.title = b.name + ' — Dijital menü';
  return `<main class="customer m-tema" style="${markaStil(b)}">${karsilama(b)}${navigator.onLine ? '' : '<div class="m-uyari">Çevrimdışısınız. Gösterilen bilgiler güncel olmayabilir.</div>'}<div id="menu-ust">${menuUst(b)}</div>
<div class="menu-search m-ara">${ic('search', 16)}<input id="menu-ara" type="search" placeholder="Ürün ara…" value="${esc(C.query)}" aria-label="Menüde ürün ara"><button aria-label="Aramayı temizle" data-act="ara-temizle" ${C.query.trim() ? '' : 'hidden'}>${ic('x', 16)}</button></div>
<div id="menu-govde">${menuGovde()}</div>
<p class="menu-disclaimer">Alerjen ve içerik bilgilerini servis ekibimizle teyit ediniz.</p>
${C.detail ? urunDetay(C.detail) : ''}</main>`;
}

function vurguAc(hex) {
  const [h, sa, l] = rgbHsl(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16));
  return hslHex(h, sa, Math.max(l, 0.62)); // koyu zeminde okunsun diye en az bu açıklıkta
}
const markaStil = (b) => `--b1:${hexOk(b.brand1) ? b.brand1 : 'var(--copper)'};--b2:${hexOk(b.brand2) ? b.brand2 : 'var(--aubergine)'};--b3:${hexOk(b.brand3) ? b.brand3 : 'color-mix(in srgb,var(--aubergine) 30%,#000)'};--m-vurgu:${hexOk(b.brand2) ? vurguAc(b.brand2) : 'var(--m-altin)'}`;

function menuUst(b) {
  const { menus, categories } = C.veri;

    h += '<div class="m-giris"><h1>Ana Kategoriler</h1><p>Lezzet yolculuğuna nereden başlamak istersiniz?</p></div>';

function menuGovde() {
  const { categories, products } = C.veri;
  const searching = C.query.trim().length > 0, q = tr(C.query);
  if (!C.main && !searching) {
    const mains = categories.filter((c) => c.menu === C.menu && c.kind === 'Ana kategori');
    return `<div class="kat-grid">${mains.length ? mains.map(katKart).join('') : '<p class="m-bos">Bu menüde henüz kategori yok.</p>'}</div>`;
  }
  const subs = categories.filter((c) => c.kind === 'Alt kategori' && c.parent === C.main);
  let kapsam = C.main ? products.filter((p) => p.category === C.main || subs.some((x) => x.id === p.category)) : products.filter((p) => !C.menu || p.menu === C.menu);
  if (C.sub) kapsam = kapsam.filter((p) => p.category === C.sub);
  const shown = searching ? kapsam.filter((p) => tr(p.name).includes(q) || tr(p.description).includes(q)) : kapsam;
  const baslik = searching ? 'Arama sonuçları' : categories.find((c) => c.id === (C.sub || C.main))?.name || '';
  return `<div class="u-baslik"><h2>${esc(baslik)}</h2><span>${shown.length} ürün</span></div><div class="u-liste">${shown.length === 0
    ? `<p class="m-bos">${searching ? 'Aramanızla eşleşen ürün bulunamadı.' : 'Bu kategoride henüz ürün yok.'}</p>`
    : shown.map((p) => `<button class="u-satir" data-act="c-detay" data-id="${p.id}">${imageUrl(p) ? resim(imageUrl(p), p.name) : '<span class="u-yedek"></span>'}<div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="u-alt"><b>${fiyat(p.price)}</b>${p.allergens ? `<small>${esc(p.allergens)}</small>` : ''}</div></div>${oku()}</button>`).join('')}</div>`;
}

const urunDetay = (p) => `<div class="detail-backdrop" data-act="c-kapat"><section class="product-detail" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
<button data-act="c-kapat">Kapat ×</button>${imageUrl(p) ? resim(imageUrl(p), p.name) : ''}<h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><b>${fiyat(p.price)}</b><p>Alerjenler: ${esc(p.allergens || 'Bilgi için servis ekibine danışınız.')}</p></section></div>`;

function render() {
  const yol = mevcutYol(); sonYol = yol;
  if (!yol.startsWith('/menu/') && C.unsub) { C.unsub(); C.unsub = null; C.slug = null; }
  let govde, aktif = yol, baslikGizli = false;
  if (yol === '/giris' || yol === '/kayit') {
    if (G.route !== yol) { G.route = yol; G.mode = yol === '/kayit' ? 'signup' : 'login'; G.error = G.message = ''; }
    govde = sayfaGiris();
  } else if (yol === '/panel') {
    if (!kullanici) return git('/giris');
    govde = sayfaPanel();
  } else if (yol.startsWith('/menu/')) {
    govde = sayfaMenu(decodeURIComponent(yol.slice(6)));
    baslikGizli = true;
  } else {
    aktif = '/';
    govde = sayfaAna();
  }
  if (!yol.startsWith('/giris') && !yol.startsWith('/kayit')) G.route = null;
  app.innerHTML = (baslikGizli ? '' : header(aktif)) + govde + (baslikGizli ? '' : footer());
  document.documentElement.classList.toggle('m-sayfa', yol.startsWith('/menu/'));
  const kar = document.getElementById('karsilama');
  document.documentElement.classList.toggle('karsilama-acik', !!kar);
  if (kar) kar.focus({ preventScroll: true });
}

async function siraKaydet(idler) {
  const tab = P.tab, tum = P.data[tab].filter((x) => x.business === P.business);
  const yeri = tum.map((x, i) => (idler.includes(x.id) ? i : -1)).filter((i) => i >= 0);
  const yeni = [...tum]; idler.forEach((id, k) => { yeni[yeri[k]] = tum.find((x) => x.id === id); });
  try {
    await Promise.all(yeni.map((x, i) => [x, i]).filter(([x, i]) => x.order !== i).map(([x, i]) => DB.update(tab, x.id, { order: i })));
    await panelYukle(); P.message = 'Sıralama kaydedildi.';
  } catch { P.message = 'Sıralama kaydedilemedi.'; }
  render();
}
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('.surukle'); if (!h) return;
  const satir = h.closest('article'), liste = satir.parentElement;
  e.preventDefault(); h.setPointerCapture(e.pointerId); satir.classList.add('surukleniyor');
  const hareket = (ev) => {
    if (ev.clientY < 90) window.scrollBy(0, -14); else if (ev.clientY > innerHeight - 90) window.scrollBy(0, 14);
    const ust = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('article');
    if (ust && ust !== satir && ust.parentElement === liste) { const k = ust.getBoundingClientRect(); liste.insertBefore(satir, ev.clientY < k.top + k.height / 2 ? ust : ust.nextSibling); }
  };
  const bitir = () => { h.removeEventListener('pointermove', hareket); satir.classList.remove('surukleniyor'); siraKaydet([...liste.children].map((a) => a.dataset.id)); };
  h.addEventListener('pointermove', hareket); h.addEventListener('pointerup', bitir, { once: true }); h.addEventListener('pointercancel', bitir, { once: true });
});
const cGecmis = () => history.pushState({ c: { gecildi: C.gecildi, main: C.main, detail: C.detail?.id || '' } }, '');
function detayKapat() {
  if (history.state?.c?.detail) history.back(); // popstate detayı kapatır
  else { C.detail = null; render(); }
}
window.addEventListener('popstate', (e) => {
  if (mevcutYol() !== sonYol) { render(); window.scrollTo(0, 0); return; } // sayfa değişti (örn. menüden panele geri)
  if (!mevcutYol().startsWith('/menu/') || !C.veri) return;
  const d = e.state?.c || { gecildi: false, main: '', detail: '' };
  if (d.main !== C.main) { C.sub = ''; C.query = ''; }
  Object.assign(C, { gecildi: d.gecildi, main: d.main, detail: d.detail ? C.veri.products.find((x) => x.id === d.detail) || null : null });
  render();
});
document.addEventListener('click', async (e) => {
  const bag = e.target.closest('a[href="#/giris"],a[href="#/kayit"]');
  if (bag && mevcutYol() === bag.getAttribute('href').slice(1)) { G.mode = bag.getAttribute('href') === '#/kayit' ? 'signup' : 'login'; G.error = G.message = ''; render(); return; }
  const ln = e.target.closest('a[href^="#/"]');
  if (ln && TEMIZ && !ln.dataset.act && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) { e.preventDefault(); git(ln.getAttribute('href').slice(1)); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'tema': {
      const koyu = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('menusef-tema', koyu ? 'dark' : 'light'); } catch {}
      break;
    }
    case 'onizleme': document.getElementById('preview')?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'auth-degistir': G.mode = G.mode === 'signup' ? 'login' : 'signup'; G.error = G.message = ''; render(); break;
    case 'gorsel-kaldir': {
      const f = el.closest('form'), dosya = f.querySelector(`[name="${id}"]`), isaret = f.querySelector(`[name="${id}_kaldir"]`);
      if (dosya) dosya.value = ''; if (isaret) isaret.value = '1';
      el.parentElement.hidden = true; break;
    }
    case 'menu-yenile': {
      const b = P.data.businesses.find((x) => x.id === P.business);
      if (!b) { P.message = 'Önce bir işletme seçin.'; render(); break; }
      P.busy = true; render();
      try {
        await panelYukle();
        const v = await DB.publicMenu(b.slug);
        P.message = v ? `Menü güncel: ${v.products.length} ürün ve ${v.categories.length} kategori yayında. Açık olan müşteri ekranları kendiliğinden güncellenir.` : 'Menü herkese açık değil. İşletme profilinden "Menüyü herkese açık yayınla" kutusunu işaretleyin.';
      } catch { P.message = 'Menü yenilenemedi. İnternet bağlantınızı kontrol edin.'; }
      P.busy = false; render(); break;
    }
    case 'urun-sek': P.urunSek = id; render(); break;
    case 'profil': P.tab = 'businesses'; P.edit = undefined; P.taslak = null; P.message = ''; git('/panel'); break;
    case 'kutuphane-doldur': {
      const yon = kullanici?.role === 'admin';
      if (!yon && !P.business) { P.message = 'Önce bir işletme seçin.'; render(); break; }
      const var_ = new Set(P.data.image_library.map(imageUrl));
      const aday = [...P.data.products, ...P.data.categories].filter((x) => (yon || x.business === P.business) && imageUrl(x) && !var_.has(imageUrl(x)));
      const tekil = [...new Map(aday.map((x) => [imageUrl(x), x])).values()];
      P.busy = true; render();
      try {
        for (const x of tekil) await DB.create('image_library', { name: x.name, image: imageUrl(x), source: 'mevcut', business: yon ? '' : x.business });
        await panelYukle();
        P.message = tekil.length ? `${tekil.length} görsel kütüphaneye eklendi.` : 'Eklenecek yeni görsel bulunamadı.';
      } catch { P.message = 'Görseller eklenemedi. Güvenlik kurallarını güncellediğinizden emin olun.'; }
      P.busy = false; render(); break;
    }
    case 'auth-giris': G.mode = 'login'; G.error = G.message = ''; render(); break;
    case 'auth-sifre': G.mode = 'reset'; G.error = G.message = ''; render(); break;
    case 'sekme': P.tab = id; P.q = ''; P.taslak = null; P.edit = undefined; P.message = ''; render(); break;
    case 'yeni': P.taslak = null; P.message = ''; P.edit = null; render(); document.querySelector('.editor')?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'duzenle': P.taslak = null; P.message = ''; P.edit = P.data[P.tab].find((r) => r.id === id); render(); document.querySelector('.editor')?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'kapat': P.taslak = null; P.edit = undefined; render(); break;
    case 'sil': kayitSil(id); break;
    case 'cikis': await DB.auth.logout(); kullanici = null; Object.assign(P, { loaded: false, data: null, business: '', tab: 'products', edit: undefined, message: '', qr: '', url: '' }); git('/giris'); break;
    case 'qr': {
      const b = P.data.businesses.find((x) => x.id === P.business);
      try { P.url = siteAdresi() + (TEMIZ ? 'menu/' : '#/menu/') + b.slug; P.qr = qrPng(P.url); } catch { P.message = 'QR kod oluşturulamadı.'; }
      render(); break;
    }
    case 'kopyala':
      navigator.clipboard.writeText(P.url).then(() => (P.message = 'Bağlantı kopyalandı.')).catch(() => (P.message = 'Bağlantıyı elle kopyalayabilirsiniz.')).finally(render);
      break;
    case 'c-menu': C.menu = id; C.main = ''; C.sub = ''; render(); cGecmis(); break;
    case 'c-ana': C.main = id; C.sub = ''; C.query = ''; render(); window.scrollTo(0, 0); cGecmis(); break;
    case 'c-geri': if (history.state?.c?.main) history.back(); else { C.main = ''; C.sub = ''; C.query = ''; render(); window.scrollTo(0, 0); } break;
    case 'k-gec': document.getElementById('karsilama')?.classList.add('kapaniyor'); setTimeout(() => { C.gecildi = true; render(); cGecmis(); }, 450); break;
    case 'c-alt': C.sub = id; render(); break;
    case 'c-detay': C.detail = C.veri.products.find((p) => p.id === id); render(); cGecmis(); break;
    case 'c-kapat': if (e.target.closest('.product-detail') && el.classList.contains('detail-backdrop')) break; detayKapat(); break;
    case 'ara-temizle': C.query = ''; render(); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'panel-ara') { P.q = e.target.value; const pos = e.target.selectionStart; render(); const i = document.getElementById('panel-ara'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } return; }
  if (e.target.name === 'slug') e.target.dataset.manuel = '1';
  if (e.target.name === 'name' && P.tab === 'businesses' && !P.edit) { const sl = e.target.form?.querySelector('[name="slug"]'); if (sl && !sl.dataset.manuel) sl.value = slugla(e.target.value); }
  if (e.target.id !== 'menu-ara') return;
  C.query = e.target.value;
  document.getElementById('menu-govde').innerHTML = menuGovde();
  document.querySelector('[data-act="ara-temizle"]').hidden = !C.query.trim();
});

document.addEventListener('change', async (e) => {
  const ad = e.target.name, dosya = e.target.files?.[0];
  if ((ad === 'logo' || ad === 'cover') && dosya) {
    const img = document.getElementById(ad === 'logo' ? 'logo-onizleme' : 'kapak-onizleme');
    if (img) { img.src = URL.createObjectURL(dosya); img.parentElement.hidden = false; }
    const isaret = document.querySelector(`[name="${ad}_kaldir"]`); if (isaret) isaret.value = '';
    if (ad === 'logo') {
      try {
        const renk = await logodanRenkler(dosya);
        if (renk) renk.forEach((h, i) => { const inp = document.querySelector(`[name="brand${i + 1}"]`); if (inp) inp.value = h; });
      } catch { /* renkler elle seçilebilir */ }
    }
    return;
  }
  if (ad === 'hazir') {
    const f = e.target.form; f.querySelector('[name="name"]').value = e.target.value;
    const ik = HAZIR_IKON[e.target.value];
    if (ik && f.querySelector('[name="kind"]').value === 'Alt kategori' && !f.querySelector('[name="icon"]:checked')) { const rd = f.querySelector(`[name="icon"][value="${ik}"]`); if (rd) rd.checked = true; }
    return;
  }
  if (ad === 'kind') {
    const alt = e.target.value === 'Alt kategori', f = e.target.form;
    f.querySelector('.alan-ana').hidden = alt; f.querySelector('.alan-alt').hidden = !alt; f.querySelector('[name="parent"]').required = alt;
    return;
  }
  if (e.target.id !== 'isletme-sec') return;
  P.business = e.target.value; P.edit = undefined; P.qr = ''; P.message = ''; render();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && C.detail) detayKapat();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'karsilama') { e.preventDefault(); e.target.click(); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'auth-form') { e.preventDefault(); girisGonder(e.target); }
  if (e.target.id === 'kayit-form') { e.preventDefault(); kayitGonder(e.target); }
});

window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

(async () => {
  try { if (localStorage.getItem('menusef-tema') === 'dark') document.documentElement.classList.add('dark'); } catch {}
  kullanici = await DB.auth.hazir();
  render();
})();

</script>
</body>
</html>
