<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menület</title>
<script>
// GitHub Pages bilinmeyen adresleri (ör. /menulet/menu/x) bu sayfayla açar.
// Ziyaretçiyi asıl siteye (index.html) yönlendirir; gidilmek istenen adres ?p= ile taşınır.
// Bu dosya her güncellemede yeniden yüklenmez; sadece index.html değişir.
(function () {
  var ilk = location.pathname.split('/')[1];
  var taban = location.hostname.slice(-10) === '.github.io' && ilk ? '/' + ilk + '/' : '/';
  var yol = location.pathname.indexOf(taban) === 0 ? location.pathname.slice(taban.length) : location.pathname.slice(1);
  location.replace(taban + '?p=' + encodeURIComponent('/' + yol + location.search) + location.hash);
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:20vh">Yönlendiriliyor… <a href="./">Ana sayfa</a></p>
</body>
</html>
